/* ---------- Web / Portada (portal_content) ---------- */
// Editor de la portada del portal: carrusel y tarjetas de acceso, por idioma.
// Lo que se publica aquí lo lee el portal en /api/portal/content/{clave}.
const LOCALES = [['*','Común'],['es','ES'],['en','EN'],['fr','FR'],['it','IT']];
const BLOCKS = [
  { key:'dashboard.hero', title:'Carrusel de portada', kind:'hero',
    help:'Imágenes a ancho completo sobre el H1. Se pasan solas cada 6,5 s. Medida recomendada: 1600×470 px (3,4:1).' },
  { key:'dashboard.tiles', title:'Tarjetas de acceso', kind:'tiles',
    help:'Reposición y Programación: fijan la ventana de servicio del carrito y llevan al catálogo. Medida recomendada: 1200×675 px (16:9).' },
];
const WINDOWS = [['replenishment','Reposición'],['scheduled','Programación']];

let locale = '*';
let blocks = {};   // clave -> { items, updatedAt, updatedBy }
let mediaFiles = [];

const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function flash(message, kind = 'ok') {
  const box = $('flash');
  box.className = 'on ' + kind;
  box.textContent = message;
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => box.className = '', kind === 'ok' ? 3000 : 7000);
}

async function apiSend(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization:'Bearer ' + token, ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { logout(); throw new Error('Sesión caducada'); }
  if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
  return data;
}

// El backend guarda las fechas en ISO; el input las quiere en hora local sin zona
const toInput = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fromInput = value => value ? new Date(value).toISOString() : '';

async function renderContent() {
  $('content').innerHTML = '<p class="muted">Cargando la portada…</p>';
  await Promise.all([loadBlocks(), loadMedia()]);
  paintContent();
}

async function loadBlocks() {
  blocks = {};
  for (const block of BLOCKS) {
    try {
      const data = await api(`/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`);
      blocks[block.key] = { items: data.items || [], updatedAt: data.updatedAt, updatedBy: data.updatedBy };
    } catch {
      blocks[block.key] = { items: [], updatedAt: null, updatedBy: null };   // bloque aún sin publicar
    }
  }
}

async function loadMedia() {
  try { mediaFiles = (await api('/api/admin/media')).items || []; }
  catch { mediaFiles = []; }
}

function paintContent() {
  $('content').innerHTML = `
    <div class="toolbar">
      <div class="tabs">${LOCALES.map(([code, label]) =>
        `<button data-locale="${code}" class="${code === locale ? 'on' : ''}">${label}</button>`).join('')}</div>
      <span class="muted">El portal usa el idioma pedido y, si no lo tiene, el contenido <b>Común</b>.</span>
      <div class="spacer"></div>
      <a class="btn-ghost" href="/es/es/dashboard" target="_blank" style="text-decoration:none">Ver la portada ↗</a>
    </div>
    ${BLOCKS.map(paintBlock).join('')}
    <div class="card block">
      <header><h2>Imágenes subidas</h2><span class="help">Se guardan en /media/portal y las sirve el propio portal.</span></header>
      ${mediaFiles.length ? `<div class="media">${mediaFiles.map(f => `
        <figure>
          <img src="${esc(f.url)}" alt="">
          <figcaption>
            <code title="${esc(f.url)}">${esc(f.name)}</code>
            <button data-media-del="${esc(f.name)}" title="Eliminar">✕</button>
          </figcaption>
        </figure>`).join('')}</div>` : '<div class="empty">Todavía no has subido ninguna imagen</div>'}
    </div>`;

  document.querySelectorAll('[data-locale]').forEach(b =>
    b.onclick = () => { locale = b.dataset.locale; renderContent(); });
  document.querySelectorAll('[data-media-del]').forEach(b =>
    b.onclick = () => deleteMedia(b.dataset.mediaDel));
  BLOCKS.forEach(wireBlock);
}

function paintBlock(block) {
  const data = blocks[block.key];
  const stamp = data.updatedAt
    ? `Publicado el ${new Date(data.updatedAt).toLocaleString()}${data.updatedBy ? ' por ' + esc(data.updatedBy) : ''}`
    : 'Sin publicar en este idioma';

  return `
    <div class="card block" data-block="${block.key}" data-kind="${block.kind}">
      <header>
        <h2>${block.title}</h2>
        <span class="help">${block.help}</span>
        <div class="spacer"></div>
        <span class="badge">${stamp}</span>
        <span class="block-actions">
          <button class="btn-ghost" data-action="add">+ Añadir</button>
          <button class="btn-ghost" data-action="clear">Vaciar</button>
          <button class="btn-primary" data-action="save">Publicar</button>
        </span>
      </header>
      ${data.items.length
        ? `<div class="c-list">${data.items.map((item, i) => paintItem(block, item, i, data.items.length)).join('')}</div>`
        : `<div class="empty">Sin elementos. Pulsa <b>+ Añadir</b> — mientras tanto el portal
             ${block.kind === 'hero' ? 'no muestra carrusel' : 'pinta las dos tarjetas con el color de marca'}.</div>`}
    </div>`;
}

// La miniatura vacía recuerda la medida que espera el portal
const emptyThumb = kind => `<span>sin imagen<br>${kind === 'hero' ? '1600×470' : '1200×675'}</span>`;

function paintItem(block, item, index, total) {
  const field = (name, label, type = 'text', extra = '') => `
    <label class="grow">${label}
      <input type="${type}" data-field="${name}" value="${esc(type === 'datetime-local' ? toInput(item[name]) : item[name] || '')}" ${extra}>
    </label>`;

  return `
    <div class="c-item ${item.active === false ? 'off' : ''}" data-index="${index}">
      <div class="c-thumb">${item.imageUrl
        ? `<img src="${esc(item.imageUrl)}" alt="">`
        : emptyThumb(block.kind)}</div>
      <div>
        <div class="c-row">
          ${field('imageUrl', 'Imagen (URL)')}
          <button class="btn-ghost" data-action="upload" style="align-self:end">Subir…</button>
          ${block.kind === 'tiles' ? `
            <label>Ventana
              <select data-field="window">${WINDOWS.map(([value, label]) =>
                `<option value="${value}" ${item.window === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
            </label>` : ''}
          <label class="chk"><input type="checkbox" data-field="active" ${item.active === false ? '' : 'checked'}> Activo</label>
        </div>
        <div class="c-row">
          ${field('title', block.kind === 'tiles' ? 'Rótulo (vacío = el del idioma)' : 'Título')}
          ${field('subtitle', 'Subtítulo')}
          ${field('alt', 'Texto alternativo')}
        </div>
        <div class="c-row">
          ${field('ctaText', 'Texto del botón')}
          ${field('ctaHref', 'Enlace', 'text', 'placeholder="/es/es/catalog/catalog"')}
          ${field('imageUrlMobile', 'Imagen móvil (opcional)')}
        </div>
        <div class="c-row">
          ${field('publishFrom', 'Publicar desde', 'datetime-local')}
          ${field('publishTo', 'Publicar hasta', 'datetime-local')}
        </div>
      </div>
      <div class="c-actions">
        <button data-action="up" ${index === 0 ? 'disabled' : ''} title="Subir">↑</button>
        <button data-action="down" ${index === total - 1 ? 'disabled' : ''} title="Bajar">↓</button>
        <button class="del" data-action="del">Eliminar</button>
      </div>
    </div>`;
}

function wireBlock(block) {
  const root = document.querySelector(`[data-block="${block.key}"]`);
  const items = blocks[block.key].items;
  const indexOf = el => Number(el.closest('.c-item').dataset.index);

  // Escribir no repinta (se perdería el foco); solo actualiza el modelo
  root.oninput = event => {
    const input = event.target.closest('[data-field]');
    if (!input) return;
    const item = items[indexOf(input)];
    const name = input.dataset.field;
    if (name === 'active') { item.active = input.checked; input.closest('.c-item').classList.toggle('off', !input.checked); }
    else if (name === 'publishFrom' || name === 'publishTo') item[name] = fromInput(input.value);
    else item[name] = input.value;
    if (name === 'imageUrl') {
      const thumb = input.closest('.c-item').querySelector('.c-thumb');
      thumb.innerHTML = item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="">` : emptyThumb(block.kind);
    }
  };

  root.onclick = event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;

    if (action === 'add') {
      items.push({ imageUrl:'', title:'', active:true, window: block.kind === 'tiles' ? nextWindow(items) : undefined });
      return paintContent();
    }
    if (action === 'save') return saveBlock(block);
    if (action === 'clear') {
      if (!items.length || confirm('¿Vaciar el bloque en este idioma? El portal dejará de mostrarlo.')) deleteBlock(block);
      return;
    }

    const index = indexOf(button);
    if (action === 'del') items.splice(index, 1);
    if (action === 'up' && index > 0) items.splice(index - 1, 0, items.splice(index, 1)[0]);
    if (action === 'down' && index < items.length - 1) items.splice(index + 1, 0, items.splice(index, 1)[0]);
    if (action === 'upload') return pickImage(items[index]);
    paintContent();
  };
}

const nextWindow = items => items.some(i => i.window === 'replenishment') ? 'scheduled' : 'replenishment';

function pickImage(item) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/avif,image/gif,image/svg+xml';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/admin/media', { method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form });
      if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
      item.imageUrl = data.url;
      flash(`Imagen subida: ${data.name}`);
      await loadMedia();
      paintContent();
    } catch (e) { flash(e.message, 'err'); }
  };
  input.click();
}

async function saveBlock(block) {
  // El orden de la lista manda; el backend valida y normaliza el resto
  const items = blocks[block.key].items.map((item, order) => ({ ...item, order }));
  try {
    const saved = await apiSend('PUT', `/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`, { items });
    blocks[block.key] = { items: saved.items, updatedAt: saved.updatedAt, updatedBy: saved.updatedBy };
    flash(`${block.title}: publicado. Recarga el portal para verlo.`);
    paintContent();
  } catch (e) { flash(`${block.title}: ${e.message}`, 'err'); }
}

async function deleteBlock(block) {
  try {
    await apiSend('DELETE', `/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`);
  } catch { /* si no existía, ya está vacío */ }
  blocks[block.key] = { items: [], updatedAt: null, updatedBy: null };
  flash(`${block.title}: bloque vaciado en este idioma.`);
  paintContent();
}

async function deleteMedia(name) {
  if (!confirm(`¿Eliminar ${name}? Los bloques que la usen se quedarán sin imagen.`)) return;
  try {
    await apiSend('DELETE', `/api/admin/media/${encodeURIComponent(name)}`);
    await loadMedia();
    paintContent();
    flash('Imagen eliminada.');
  } catch (e) { flash(e.message, 'err'); }
}

/* ---------- Imágenes de modelo (marketing) ---------- */
// Asigna la imagen de cada modelo del catálogo. Escribe el documento de sync
// "model-image" que ya lee el catálogo comprable (GET /api/shop/catalog): subir un
// fichero (POST /api/admin/media) o pegar una URL, y quitarla. No depende de BC.
let modelImages = [];

async function renderModelImages() {
  $('content').innerHTML = '<p class="muted">Cargando modelos del catálogo…</p>';
  try { modelImages = (await api('/api/admin/model-images')).items || []; }
  catch { return; }   // api() ya avisa (401/403); no repintamos sobre el error
  paintModelImages();
}

function paintModelImages() {
  const withImg = modelImages.filter(m => m.imageUri).length;
  $('content').innerHTML = `
    <div class="toolbar">
      <input type="search" id="mi-q" placeholder="Filtrar por referencia o nombre…">
      <button class="btn-ghost" id="mi-reload">↻ Actualizar</button>
      <div class="spacer"></div>
      <span class="muted">${withImg} de ${modelImages.length} modelos con imagen asignada</span>
    </div>
    <div class="card mi">
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Imagen</th><th>Referencia</th><th>Modelo</th><th>URL de la imagen</th><th></th></tr></thead>
        <tbody id="mi-rows"></tbody>
      </table></div>
    </div>`;
  $('mi-reload').onclick = renderModelImages;
  $('mi-q').oninput = paintModelImageRows;
  const rows = $('mi-rows');
  // Escribir en la URL no repinta (se perdería el foco): solo actualiza el modelo
  rows.oninput = event => {
    const input = event.target.closest('.mi-url');
    if (!input) return;
    const model = modelImages.find(m => m.externalId === input.closest('tr').dataset.id);
    if (model) model.imageUri = input.value;
  };
  rows.onclick = event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const id = button.closest('tr').dataset.id;
    const model = modelImages.find(m => m.externalId === id);
    if (!model) return;
    if (button.dataset.action === 'upload') return uploadModelImage(model);
    if (button.dataset.action === 'save') return saveModelImage(model);
    if (button.dataset.action === 'clear') return clearModelImage(model);
  };
  paintModelImageRows();
}

function paintModelImageRows() {
  const q = ($('mi-q')?.value || '').toLowerCase();
  const rows = modelImages.filter(m =>
    !q || (m.reference || '').toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q));
  $('mi-rows').innerHTML = rows.map(m => `
    <tr data-id="${esc(m.externalId)}">
      <td class="mi-thumb">${m.imageUri
        ? `<img src="${esc(m.imageUri)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'no carga'}))">`
        : `<div class="ph">sin<br>imagen</div>`}</td>
      <td class="mi-ref">${esc(m.reference) || '—'}</td>
      <td>${esc(m.name) || '—'}</td>
      <td><input class="mi-url" value="${esc(m.imageUri || '')}" placeholder="https://… o /media/portal/…"></td>
      <td class="mi-actions">
        <button class="btn-ghost" data-action="upload">Subir…</button>
        <button class="btn-primary" data-action="save">Guardar</button>
        <button class="del" data-action="clear" ${m.imageUri ? '' : 'disabled'}>Quitar</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="5" class="empty">${
      q ? 'Ningún modelo coincide con el filtro' : 'El catálogo todavía no tiene modelos — sincroniza desde BC'}</td></tr>`;
}

// Sube el fichero a /media/portal y fija esa URL como imagen del modelo
function uploadModelImage(model) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/avif,image/gif,image/svg+xml';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/admin/media', { method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form });
      if (res.status === 401) { logout(); throw new Error('Sesión caducada'); }
      if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
      model.imageUri = data.url;
      await putModelImage(model, `Imagen de ${model.reference || model.name} subida y asignada.`);
    } catch (e) { flash(e.message, 'err'); }
  };
  input.click();
}

// Guarda la URL escrita/pegada en el campo
function saveModelImage(model) {
  const uri = (model.imageUri || '').trim();
  if (!uri) return flash('Escribe una URL o pulsa «Subir…» antes de guardar.', 'err');
  putModelImage(model, `Imagen de ${model.reference || model.name} guardada.`);
}

async function putModelImage(model, okMessage) {
  try {
    await apiSend('PUT', `/api/admin/model-images/${encodeURIComponent(model.externalId)}`, { uri: (model.imageUri || '').trim() });
    flash(okMessage);
    paintModelImageRows();
  } catch (e) { flash(e.message, 'err'); }
}

async function clearModelImage(model) {
  if (!confirm(`¿Quitar la imagen de ${model.reference || model.name}? El catálogo volverá al placeholder.`)) return;
  try {
    await apiSend('DELETE', `/api/admin/model-images/${encodeURIComponent(model.externalId)}`);
    model.imageUri = null;
    flash('Imagen quitada.');
    paintModelImageRows();
  } catch (e) { flash(e.message, 'err'); }
}

/* ---------- Web / Lookbook ---------- */
// Editor del Lookbook "Colecciones lejan": portada (carrusel) + historias editoriales
// con su raíl de productos comprables. Escribe las claves lookbook.hero y
// lookbook.stories de portal_content; el portal las lee en /es/es/lookbook.
const LB_BLOCKS = [
  { key:'lookbook.hero', title:'Portada del lookbook', kind:'lb-hero',
    help:'Carrusel de apertura del lookbook. Medida recomendada: 2880×1200 px o mayor (apaisado).' },
  { key:'lookbook.stories', title:'Historias', kind:'lb-story',
    help:'Cada historia: una foto, un texto editorial, un color de acento y los productos de su raíl «Compra el look».' },
];
const LB_LAYOUTS = [['right','Foto a la derecha'],['left','Foto a la izquierda']];

let lbLocale = '*';
let lbBlocks = {};   // clave -> { items, updatedAt, updatedBy }
let lbModels = [];   // modelos del catálogo, para el selector de productos

async function renderLookbook() {
  $('content').innerHTML = '<p class="muted">Cargando el lookbook…</p>';
  await Promise.all([lbLoad(), lbLoadModels()]);
  paintLookbook();
}

async function lbLoad() {
  lbBlocks = {};
  for (const block of LB_BLOCKS) {
    try {
      const data = await api(`/api/admin/content/${block.key}?locale=${encodeURIComponent(lbLocale)}`);
      lbBlocks[block.key] = { items: data.items || [], updatedAt: data.updatedAt, updatedBy: data.updatedBy };
    } catch {
      lbBlocks[block.key] = { items: [], updatedAt: null, updatedBy: null };   // bloque aún sin publicar
    }
  }
}

async function lbLoadModels() {
  try { lbModels = (await api('/api/admin/model-images')).items || []; }
  catch { lbModels = []; }
}

const lbModelById = id => lbModels.find(m => m.externalId === id);

function paintLookbook() {
  $('content').innerHTML = `
    <div class="toolbar">
      <div class="tabs">${LOCALES.map(([code, label]) =>
        `<button data-lb-locale="${code}" class="${code === lbLocale ? 'on' : ''}">${label}</button>`).join('')}</div>
      <span class="muted">El portal usa el idioma pedido y, si no lo tiene, el contenido <b>Común</b>.</span>
      <div class="spacer"></div>
      <a class="btn-ghost" href="/es/es/lookbook" target="_blank" style="text-decoration:none">Ver el lookbook ↗</a>
    </div>
    ${LB_BLOCKS.map(paintLbBlock).join('')}`;

  document.querySelectorAll('[data-lb-locale]').forEach(b =>
    b.onclick = () => { lbLocale = b.dataset.lbLocale; renderLookbook(); });
  LB_BLOCKS.forEach(wireLbBlock);
}

function paintLbBlock(block) {
  const data = lbBlocks[block.key];
  const stamp = data.updatedAt
    ? `Publicado el ${new Date(data.updatedAt).toLocaleString()}${data.updatedBy ? ' por ' + esc(data.updatedBy) : ''}`
    : 'Sin publicar en este idioma';
  const paint = block.kind === 'lb-hero' ? paintLbHeroItem : paintLbStoryItem;
  const emptyMsg = block.kind === 'lb-hero'
    ? 'Sin portada. Pulsa <b>+ Añadir</b> — mientras tanto el lookbook abre directamente con las historias.'
    : 'Sin historias. Pulsa <b>+ Añadir</b> para crear la primera.';
  return `
    <div class="card block" data-lb-block="${block.key}" data-kind="${block.kind}">
      <header>
        <h2>${block.title}</h2>
        <span class="help">${block.help}</span>
        <div class="spacer"></div>
        <span class="badge">${stamp}</span>
        <span class="block-actions">
          <button class="btn-ghost" data-action="add">+ Añadir</button>
          <button class="btn-ghost" data-action="clear">Vaciar</button>
          <button class="btn-primary" data-action="save">Publicar</button>
        </span>
      </header>
      ${data.items.length
        ? `<div class="c-list">${data.items.map((item, i) => paint(item, i, data.items.length)).join('')}</div>`
        : `<div class="empty">${emptyMsg}</div>`}
    </div>`;
}

const lbField = (item, name, label, type = 'text', extra = '') => `
  <label class="grow">${label}
    <input type="${type}" data-field="${name}" value="${esc(type === 'datetime-local' ? toInput(item[name]) : item[name] || '')}" ${extra}>
  </label>`;

const lbEmptyThumb = kind => `<span>sin imagen<br>${kind === 'lb-hero' ? 'apaisada' : '4:3'}</span>`;

const lbActions = (index, total) => `
  <div class="c-actions">
    <button data-action="up" ${index === 0 ? 'disabled' : ''} title="Subir">↑</button>
    <button data-action="down" ${index === total - 1 ? 'disabled' : ''} title="Bajar">↓</button>
    <button class="del" data-action="del">Eliminar</button>
  </div>`;

function paintLbHeroItem(item, index, total) {
  return `
    <div class="c-item ${item.active === false ? 'off' : ''}" data-index="${index}">
      <div class="c-thumb">${item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="">` : lbEmptyThumb('lb-hero')}</div>
      <div>
        <div class="c-row">
          ${lbField(item, 'imageUrl', 'Imagen (URL)')}
          <button class="btn-ghost" data-action="upload" style="align-self:end">Subir…</button>
          <label class="chk"><input type="checkbox" data-field="active" ${item.active === false ? '' : 'checked'}> Activo</label>
        </div>
        <div class="c-row">
          ${lbField(item, 'title', 'Título')}
          ${lbField(item, 'subtitle', 'Subtítulo')}
          ${lbField(item, 'alt', 'Texto alternativo')}
        </div>
        <div class="c-row">
          ${lbField(item, 'ctaText', 'Texto del botón')}
          ${lbField(item, 'ctaHref', 'Enlace', 'text', 'placeholder="/es/es/catalog/catalog"')}
          ${lbField(item, 'imageUrlMobile', 'Imagen móvil (opcional)')}
        </div>
        <div class="c-hint">Fechas opcionales: si las dejas vacías, la portada se ve siempre.</div>
        <div class="c-row">
          ${lbField(item, 'publishFrom', 'Publicar desde', 'datetime-local')}
          ${lbField(item, 'publishTo', 'Publicar hasta', 'datetime-local')}
        </div>
      </div>
      ${lbActions(index, total)}
    </div>`;
}

function paintLbStoryItem(item, index, total) {
  const validHex = /^#[0-9a-fA-F]{6}$/.test(item.accent || '');
  const layout = item.layout === 'left' ? 'left' : 'right';
  return `
    <div class="c-item ${item.active === false ? 'off' : ''}" data-index="${index}">
      <div class="c-thumb">${item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="">` : lbEmptyThumb('lb-story')}</div>
      <div>
        <div class="lbp-wrap">
          <div class="lbp-label">Vista previa</div>
          <div data-preview>${lbStoryPreview(item)}</div>
        </div>
        <div class="c-row">
          ${lbField(item, 'imageUrl', 'Imagen (URL)')}
          <button class="btn-ghost" data-action="upload" style="align-self:end">Subir…</button>
          <label class="lb-color" title="Déjalo vacío para usar el color de marca">Acento <span class="lb-hintlabel">(vacío = marca)</span>
            <input type="color" data-field="accentColor" value="${validHex ? item.accent : '#1f5c46'}">
            <input type="text" data-field="accent" value="${esc(item.accent || '')}" placeholder="(marca)" maxlength="9">
          </label>
          <label>Disposición
            <select data-field="layout">${LB_LAYOUTS.map(([v, l]) =>
              `<option value="${v}" ${layout === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          </label>
          <label class="chk"><input type="checkbox" data-field="active" ${item.active === false ? '' : 'checked'}> Activo</label>
        </div>
        <div class="c-row">
          ${lbField(item, 'kicker', 'Etiqueta (kicker)', 'text', 'placeholder="p. ej. NUEVA TEMPORADA"')}
          ${lbField(item, 'title', 'Título')}
        </div>
        <div class="c-row lb-body">
          <label class="grow">Texto
            <textarea data-field="body">${esc(item.body || '')}</textarea>
          </label>
        </div>
        <div class="c-row">
          <div class="lb-refs">
            <div class="lb-refs-title">Productos del raíl «Compra el look»${item.refs && item.refs.length ? ` · ${item.refs.length}` : ''}</div>
            <div class="lb-chips">${(item.refs || []).map(lbRefChip).join('')}</div>
            <div class="lb-picker">
              <input type="search" data-ref-search aria-label="Buscar producto para el raíl"
                placeholder="Buscar producto por referencia o nombre…" autocomplete="off">
              <div class="lb-picker-list"></div>
            </div>
          </div>
        </div>
        <div class="c-hint">Fechas opcionales: si las dejas vacías, la historia se ve siempre.</div>
        <div class="c-row">
          ${lbField(item, 'publishFrom', 'Publicar desde', 'datetime-local')}
          ${lbField(item, 'publishTo', 'Publicar hasta', 'datetime-local')}
        </div>
      </div>
      ${lbActions(index, total)}
    </div>`;
}

// Vista previa en vivo de la historia: mini-tarjeta que imita el portal (imagen,
// kicker con el acento, título y disposición foto izq/dcha).
function lbStoryPreview(item) {
  const accent = /^#[0-9a-fA-F]{3,8}$/.test(item.accent || '') ? item.accent : 'var(--accent)';
  const img = item.imageUrl
    ? `<div class="lbp-img"><img src="${esc(item.imageUrl)}" alt=""></div>`
    : `<div class="lbp-img"></div>`;
  const text = `<div class="lbp-text">
      <span class="lbp-kicker" style="color:${esc(accent)}">${esc(item.kicker || 'ETIQUETA')}</span>
      <span class="lbp-title">${esc(item.title || 'Título de la historia')}</span>
      <span class="lbp-count">${(item.refs || []).length} producto(s) en el raíl</span>
    </div>`;
  return `<div class="lbp">${item.layout === 'left' ? img + text : text + img}</div>`;
}

function lbRefChip(id) {
  const model = lbModelById(id);
  const remove = `<button type="button" class="x" data-ref-del="${esc(id)}" title="Quitar">✕</button>`;
  if (!model)
    return `<span class="lb-chip"><img alt=""><span class="miss" title="Este id ya no está en el catálogo">${esc(id)} ⚠</span>${remove}</span>`;
  const name = esc(model.name || model.reference || id);
  const title = esc([model.name, model.reference].filter(Boolean).join(' · '));
  const thumb = model.imageUri ? `<img src="${esc(model.imageUri)}" alt="">` : `<img alt="">`;
  return `<span class="lb-chip" title="${title}">${thumb}${name}${remove}</span>`;
}

function lbPickerResults(query, selected) {
  const q = (query || '').trim().toLowerCase();
  const chosen = new Set(selected || []);
  const all = lbModels.filter(m => !chosen.has(m.externalId) &&
    (!q || (m.reference || '').toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q)));
  const matches = all.slice(0, 25);
  if (!matches.length) return `<div class="lb-picker-empty">Sin productos que coincidan.</div>`;
  const more = all.length > matches.length
    ? `<div class="lb-picker-empty">Mostrando 25 de ${all.length} — sigue escribiendo para afinar.</div>` : '';
  return matches.map(m => `
    <button type="button" data-ref-add="${esc(m.externalId)}">
      ${m.imageUri ? `<img src="${esc(m.imageUri)}" alt="">` : `<span class="ph"></span>`}
      <span>${esc(m.name || '—')}</span><span class="ref">${esc(m.reference || '')}</span>
    </button>`).join('') + more;
}

// Actualiza SOLO los chips + contador + lista + preview de una historia, sin repintar
// toda la vista: así al añadir productos el buscador sigue abierto y con el foco.
function lbSyncRefs(cItem, item, searchValue) {
  const chips = cItem.querySelector('.lb-chips');
  if (chips) chips.innerHTML = (item.refs || []).map(lbRefChip).join('');
  const title = cItem.querySelector('.lb-refs-title');
  if (title) title.textContent = `Productos del raíl «Compra el look»${item.refs && item.refs.length ? ` · ${item.refs.length}` : ''}`;
  const list = cItem.querySelector('.lb-picker-list');
  if (list) list.innerHTML = lbPickerResults(searchValue || '', item.refs || []);
  const preview = cItem.querySelector('[data-preview]');
  if (preview) preview.innerHTML = lbStoryPreview(item);
}

function wireLbBlock(block) {
  const root = document.querySelector(`[data-lb-block="${block.key}"]`);
  const items = lbBlocks[block.key].items;
  const indexOf = el => Number(el.closest('.c-item').dataset.index);
  const isStory = block.kind === 'lb-story';

  const openPicker = el => {
    const cItem = el.closest('.c-item');
    const item = items[indexOf(el)];
    const list = cItem.querySelector('.lb-picker-list');
    list.innerHTML = lbPickerResults(cItem.querySelector('[data-ref-search]').value, item.refs || []);
    list.classList.add('on');
  };

  // Escribir no repinta (se perdería el foco): solo actualiza el modelo y la preview
  root.oninput = event => {
    // Buscador del selector de productos: filtra la lista, sin tocar la historia
    if (event.target.closest('[data-ref-search]')) { openPicker(event.target); return; }

    const input = event.target.closest('[data-field]');
    if (!input) return;
    const cItem = input.closest('.c-item');
    const item = items[indexOf(input)];
    const name = input.dataset.field;

    if (name === 'active') { item.active = input.checked; cItem.classList.toggle('off', !input.checked); return; }
    if (name === 'publishFrom' || name === 'publishTo') { item[name] = fromInput(input.value); return; }
    if (name === 'accentColor') {
      // El selector de color escribe el campo de texto, que es la fuente de verdad
      item.accent = input.value;
      const text = cItem.querySelector('[data-field="accent"]');
      if (text) text.value = input.value;
    } else {
      item[name] = input.value;
      if (name === 'accent') {
        const color = cItem.querySelector('[data-field="accentColor"]');
        if (color && /^#[0-9a-fA-F]{6}$/.test(input.value)) color.value = input.value;
      }
      if (name === 'imageUrl') {
        const thumb = cItem.querySelector('.c-thumb');
        thumb.innerHTML = item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="">` : lbEmptyThumb(block.kind);
      }
    }
    if (isStory) {
      const preview = cItem.querySelector('[data-preview]');
      if (preview) preview.innerHTML = lbStoryPreview(item);
    }
  };

  root.onclick = event => {
    // Al enfocar el buscador, abre la lista con los productos disponibles
    if (event.target.closest('[data-ref-search]')) { openPicker(event.target); return; }

    // Añadir / quitar un producto del raíl: actualización incremental (no repinta la vista)
    const add = event.target.closest('[data-ref-add]');
    if (add) {
      const cItem = add.closest('.c-item');
      const item = items[indexOf(add)];
      item.refs = item.refs || [];
      if (!item.refs.includes(add.dataset.refAdd)) item.refs.push(add.dataset.refAdd);
      const search = cItem.querySelector('[data-ref-search]');
      lbSyncRefs(cItem, item, search ? search.value : '');
      cItem.querySelector('.lb-picker-list').classList.add('on');
      if (search) search.focus();
      return;
    }
    const del = event.target.closest('[data-ref-del]');
    if (del) {
      const cItem = del.closest('.c-item');
      const item = items[indexOf(del)];
      item.refs = (item.refs || []).filter(r => r !== del.dataset.refDel);
      const search = cItem.querySelector('[data-ref-search]');
      lbSyncRefs(cItem, item, search ? search.value : '');
      return;
    }

    // Pulsar fuera de un selector cierra los que estén abiertos
    root.querySelectorAll('.lb-picker-list.on').forEach(l => l.classList.remove('on'));

    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;

    if (action === 'add') {
      items.push(block.kind === 'lb-hero'
        ? { imageUrl:'', title:'', active:true }
        : { imageUrl:'', kicker:'', title:'', body:'', accent:'', layout:'right', refs:[], active:true });
      return paintLookbook();
    }
    if (action === 'save') return lbSave(block);
    if (action === 'clear') {
      if (!items.length || confirm('¿Vaciar este bloque en este idioma? El lookbook dejará de mostrarlo.')) lbDelete(block);
      return;
    }
    if (action === 'upload') return lbPickImage(items[indexOf(button)]);

    const index = indexOf(button);
    if (action === 'del') items.splice(index, 1);
    if (action === 'up' && index > 0) items.splice(index - 1, 0, items.splice(index, 1)[0]);
    if (action === 'down' && index < items.length - 1) items.splice(index + 1, 0, items.splice(index, 1)[0]);
    paintLookbook();
  };
}

function lbPickImage(item) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/avif,image/gif,image/svg+xml';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/admin/media', { method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form });
      if (res.status === 401) { logout(); throw new Error('Sesión caducada'); }
      if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
      item.imageUrl = data.url;
      flash(`Imagen subida: ${data.name}`);
      paintLookbook();
    } catch (e) { flash(e.message, 'err'); }
  };
  input.click();
}

async function lbSave(block) {
  // El orden de la lista manda; el backend valida y normaliza el resto
  const items = lbBlocks[block.key].items.map((item, order) => ({ ...item, order }));
  try {
    const saved = await apiSend('PUT', `/api/admin/content/${block.key}?locale=${encodeURIComponent(lbLocale)}`, { items });
    lbBlocks[block.key] = { items: saved.items, updatedAt: saved.updatedAt, updatedBy: saved.updatedBy };
    flash(`${block.title}: publicado. Recarga el lookbook para verlo.`);
    paintLookbook();
  } catch (e) { flash(`${block.title}: ${e.message}`, 'err'); }
}

async function lbDelete(block) {
  try { await apiSend('DELETE', `/api/admin/content/${block.key}?locale=${encodeURIComponent(lbLocale)}`); }
  catch { /* si no existía, ya está vacío */ }
  lbBlocks[block.key] = { items: [], updatedAt: null, updatedBy: null };
  flash(`${block.title}: bloque vaciado en este idioma.`);
  paintLookbook();
}

/* ---------- detalle ---------- */
function openDetail(row) {
  $('mTitle').textContent = `${row.doc.entityType} · ${row.doc.externalId}`;
  $('mMeta').textContent = `primera vez ${new Date(row.doc.firstReceivedAt).toLocaleString()} · última ${new Date(row.doc.lastReceivedAt).toLocaleString()}`;
  let pretty = row.doc.payload;
  try { pretty = JSON.stringify(JSON.parse(row.doc.payload), null, 2); } catch {}
  $('mBody').textContent = pretty;
  $('modal').classList.add('on');
}
function closeModal() { $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

/* ---------- init ---------- */
$('doLogin').onclick = login;
$('email').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logout').onclick = logout;
$('brandHome').onclick = e => { e.preventDefault(); show('dashboard'); };
if (token) enter();
