<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>MITO PROJECTS — CMS</title>
<style>
  /* Rediseño Modernist del CMS: negro/rojo, Archivo, radio 0 (era azul) */
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
  :root {
    --side:#201e1d; --side-2:#2d2b2b; --side-text:rgba(243,242,242,.72); --side-active:#ffffff;
    --bg:#f3f2f2; --card:#f8f4f4; --line:#d3cfcf; --text:#201e1d; --muted:#7d7979;
    --accent:#ec3013; --accent-2:#dd2b0f; --ok:#1f7a45; --ok-bg:#e3f5ea;
    --warn:#8a6100; --warn-bg:#fdf3d7; --err:#ec3013; --err-bg:#ffe0d9;
    --info:#ec3013; --info-bg:#ffe0d9;
    --r:0px; --shadow:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent), 0 8px 24px -12px color-mix(in srgb,#2d2b2b 20%,transparent);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:14px/1.45 "Archivo",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  h1,h2,h3,h4 { font-family:"Archivo",sans-serif; font-weight:800; letter-spacing:-.02em; }

  /* ---------- Login (mismo "login split" del portal/gestión) ---------- */
  #login-screen { position:fixed; inset:0; z-index:30; background:var(--bg); overflow:auto; }
  .login-split { min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr; }
  .login-hero { background:var(--accent); color:#fff; display:flex; flex-direction:column;
    justify-content:space-between; gap:2rem; padding:clamp(2rem,5vw,3.5rem); }
  .login-hero .brand { color:#fff; font-weight:800; font-size:1.9rem; letter-spacing:-.03em; }
  .login-hero .brand sup { font-size:.42em; vertical-align:.9em; }
  .login-hero .hero-kicker { font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; opacity:.92; margin:0 0 .6rem; }
  .login-display { font-weight:800; text-transform:uppercase; letter-spacing:-.03em; line-height:.96;
    font-size:clamp(2.4rem,6vw,4.8rem); margin:0; color:#fff; }
  .login-hero .hero-note { color:rgba(255,255,255,.85); max-width:26rem; margin:0; }
  .login-panel { display:grid; place-items:center; padding:2rem clamp(1.5rem,5vw,4rem); }
  .login-card { width:min(25rem,100%); background:none; box-shadow:none; padding:0; border-radius:0;
    display:flex; flex-direction:column; gap:0; }
  .login-h { font-weight:800; font-size:2rem; margin:0 0 1.4rem; letter-spacing:-.02em; }
  .login-card .field { width:100%; border:1px solid var(--line); border-radius:4px; padding:.85rem 1rem;
    margin-bottom:.9rem; background:#fff; }
  .login-card .field:focus { border-color:var(--accent); box-shadow:none; }
  .login-card .submit { width:100%; background:var(--accent); color:#fff; font-weight:700; letter-spacing:.04em;
    border-radius:4px; padding:.95rem; border:none; }
  .login-card .submit:hover { background:var(--accent-2); }
  .login-card .submit[disabled] { opacity:.6; cursor:progress; }
  .login-card .err { color:var(--err); font-size:.85rem; min-height:1.3em; margin:.6rem 0 0; }
  .login-card .login-note { font-size:.82rem; color:var(--muted); margin:.7rem 0 0; }
  @media (max-width:52rem) { .login-split { grid-template-columns:1fr; } .login-hero { min-height:34vh; } }
  input, select { font:inherit; padding:.6rem .75rem; border-radius:0; border:1px solid var(--line); background:#fff; }
  input:focus-visible, select:focus-visible, button:focus-visible, .nav-item:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  .nav-item:focus-visible { outline-color:#fff; outline-offset:-2px; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(236,48,19,.18); }
  button { font:inherit; font-weight:600; padding:.6rem 1rem; border-radius:0; border:1px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-2); }
  .btn-ghost { background:transparent; color:var(--accent); border-color:var(--line); }
  .btn-ghost:hover { border-color:var(--accent); }
  .error { color:var(--err); font-size:.85rem; min-height:1.2em; margin:0; }

  /* ---------- Shell (cabecera negra + sidebar claro, IGUAL que /manage) ---------- */
  #app { display:none; }
  #app.on { display:flex; flex-direction:column; min-height:100vh; }
  /* Valores IDÉNTICOS a la cabecera de /manage (app.css): height 66px, #201e1d,
     tinta #f3f2f2 / rgba(243,242,242,.62). Así conmutar no cambia el diseño. */
  .cms-header { position:sticky; top:0; z-index:20; height:66px; display:flex; align-items:center; gap:1.1rem;
    padding:0 clamp(1rem,3vw,2rem); background:#201e1d; color:#f3f2f2; border-bottom:1px solid rgba(0,0,0,.14); }
  .cms-header .brand { font-weight:800; font-size:1.28rem; letter-spacing:-.02em; color:#f3f2f2; text-decoration:none; line-height:1; }
  .cms-header .brand sup { font-size:.42em; vertical-align:.9em; }
  .cms-header .hspace { flex:1; }
  .cms-portal { color:rgba(243,242,242,.62); text-decoration:none; font-size:.82rem; display:inline-flex; align-items:center; gap:.4rem; }
  .cms-portal:hover { color:#f3f2f2; }
  .cms-who { display:flex; align-items:center; gap:.6rem; }
  .cms-who .who { text-align:right; line-height:1.3; font-size:.78rem; }
  .cms-who .who .l1 { color:#f3f2f2; }
  .cms-who .who .l2 { color:rgba(243,242,242,.62); }
  .cms-who .avatar { width:2rem; height:2rem; background:var(--accent); color:#fff; display:grid; place-items:center;
    font-weight:800; font-size:.85rem; }
  .cms-out { color:#f3f2f2; background:none; border:1px solid rgba(255,255,255,.28); border-radius:999px;
    padding:.4rem .9rem; font-size:.76rem; font-weight:600; letter-spacing:.03em; }
  .cms-out:hover { background:rgba(255,255,255,.12); }
  .cms-header a:focus-visible, .cms-header button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  /* Conmutador de área (Gestión | CMS): idéntico a .mng-switch de /manage */
  .seg { display:inline-flex; border:1px solid rgba(255,255,255,.28); }
  .seg .seg-btn { padding:.42rem 1rem; font-size:.74rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:rgba(243,242,242,.62); text-decoration:none; line-height:1.25; }
  .seg .seg-btn + .seg-btn { border-left:1px solid rgba(255,255,255,.28); }
  .seg a.seg-btn:hover { background:rgba(255,255,255,.12); color:#f3f2f2; }
  .seg .seg-btn.on { background:var(--accent); color:#fff; }

  .cms-body { display:grid; grid-template-columns:15.5rem 1fr; flex:1; min-height:0; }
  aside { background:var(--card); color:var(--muted); border-right:1px solid var(--line); overflow-y:auto; display:block; }
  nav { padding:.8rem 0 1.5rem; }
  .group { padding:.6rem 0; }
  .group + .group { border-top:1px solid var(--line); }
  .group-title { display:flex; align-items:center; gap:.6rem; width:100%; padding:.4rem 1.4rem;
    background:none; border:none; color:var(--muted); font-weight:800; font-size:.64rem; letter-spacing:.14em;
    text-transform:uppercase; text-align:left; cursor:pointer; }
  .group-title:hover { color:var(--text); background:none; }
  .group-title .chev { margin-left:auto; transition:transform .15s; font-size:.7rem; opacity:.5; }
  .group.open .chev { transform:rotate(90deg); }
  .group .items { display:none; }
  .group.open .items { display:block; }
  .nav-item { font:inherit; display:flex; align-items:center; gap:.6rem; padding:.5rem 1.4rem;
    color:var(--text); text-decoration:none; font-size:.9rem; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
  .nav-item:hover { background:var(--bg); color:var(--text); }
  .nav-item.active, .nav-item[aria-current="page"] { background:var(--accent); color:#fff; font-weight:700; }
  .nav-item .count { margin-left:auto; font-size:.72rem; background:var(--bg); color:var(--muted); border-radius:0; padding:.05rem .5rem; }
  .nav-item.active .count { background:rgba(255,255,255,.22); color:#fff; }
  .nav-item.soon { opacity:.4; cursor:default; }
  .nav-item.soon:hover { background:none; color:var(--text); }
  /* Icono en cajita cuadrada, IGUAL que .mng-link svg de GESTIÓN */
  .nav-item svg { flex:none; color:var(--muted); width:1.6rem; height:1.6rem; padding:.28rem;
    background:var(--bg); box-sizing:border-box; transition:color .12s, background .12s; }
  .nav-item > span { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .nav-item:hover svg { color:var(--text); }
  .nav-item.active svg, .nav-item[aria-current="page"] svg { color:#fff; background:rgba(255,255,255,.18); }

  main { overflow-y:auto; padding:1.6rem 2rem 3rem; }
  .crumb { color:var(--muted); font-size:.8rem; margin-bottom:.2rem; }
  h1 { margin:.1rem 0 1.1rem; font-size:1.7rem; letter-spacing:-.03em; }

  .toolbar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem; }
  .toolbar input[type=search] { min-width:18rem; }
  .toolbar .spacer { flex:1; }
  .muted { color:var(--muted); font-size:.85rem; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.9rem; margin-bottom:1.4rem; }
  .kpi { background:none; border-radius:0; box-shadow:none; padding:.85rem 0 0; border-top:2px solid var(--text); }
  .kpi .label { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; }
  .kpi .value { font-size:1.55rem; font-weight:750; letter-spacing:-.02em; margin-top:.15rem; }
  .kpi.green, .kpi.yellow, .kpi.red { border-top-color:var(--accent); }

  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.87rem; }
  thead th { position:sticky; top:0; background:var(--bg); color:var(--muted); border-bottom:2px solid var(--text);
    font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; text-align:left; padding:.6rem .8rem; }
  tbody td { padding:.55rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:18rem; }
  tbody tr:hover { background:#f0f4ff; cursor:pointer; }
  tbody tr:last-child td { border-bottom:none; }
  .chip { display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.74rem; font-weight:650; }
  .chip.ok { background:var(--ok-bg); color:var(--ok); } .chip.err { background:var(--err-bg); color:var(--err); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); } .chip.info { background:var(--info-bg); color:var(--info); }
  .chip.plain { background:#eef0f4; color:#374151; }
  .empty { padding:2.4rem; text-align:center; color:var(--muted); }
  code.id { font:.78rem ui-monospace,Consolas,monospace; color:var(--muted); }

  .pager { display:flex; gap:.5rem; align-items:center; justify-content:flex-end; padding:.6rem .8rem; border-top:1px solid var(--line); }
  .pager button { padding:.3rem .7rem; }

  /* ---------- Web / Portada ---------- */
  .tabs { display:flex; gap:.3rem; background:#e9ebf1; padding:.25rem; border-radius:0; }
  .tabs button { background:none; color:var(--muted); padding:.35rem .9rem; border-radius:0; font-size:.85rem; }
  .tabs button.on { background:#fff; color:var(--text); box-shadow:var(--shadow); }
  .block { margin-bottom:1.4rem; }
  .block > header { display:flex; align-items:center; gap:.8rem; padding:.9rem 1.1rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .block > header h2 { margin:0; font-size:1rem; }
  .block > header .spacer { flex:1; }
  .block .help { color:var(--muted); font-size:.8rem; }
  .c-list { padding:.9rem 1.1rem; display:flex; flex-direction:column; gap:.9rem; }
  .c-item { display:grid; grid-template-columns:9.5rem 1fr auto; gap:.9rem; align-items:start;
    border:1px solid var(--line); border-radius:0; padding:.8rem; background:#fbfcfe; }
  .c-item.off { opacity:.55; }
  .c-thumb { aspect-ratio:16/9; border-radius:0; overflow:hidden; background:#eceef3; display:grid; place-items:center;
    color:var(--muted); font-size:.72rem; text-align:center; }
  /* La miniatura enseña el recorte real: el hero del portal es 3,4:1, no 16:9 */
  .block[data-kind="hero"] .c-thumb { aspect-ratio:3.4/1; }
  .c-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .c-row { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:.55rem; }
  .c-row:last-child { margin-bottom:0; }
  .c-item label { display:flex; flex-direction:column; gap:.2rem; font-size:.72rem; color:var(--muted); }
  .c-item label.grow { flex:1; min-width:9rem; }
  .c-item label.chk { flex-direction:row; align-items:center; gap:.35rem; font-size:.8rem; color:var(--text); align-self:end; padding-bottom:.5rem; }
  .c-item input, .c-item select { font-size:.82rem; padding:.4rem .55rem; }
  .c-actions { display:flex; flex-direction:column; gap:.35rem; }
  .c-actions button { padding:.3rem .6rem; font-size:.78rem; background:#fff; border:1px solid var(--line); color:var(--muted); }
  .c-actions button:hover { border-color:var(--accent); color:var(--accent); }
  .c-actions button.del:hover { border-color:var(--err); color:var(--err); }
  .c-actions button[disabled] { opacity:.35; cursor:default; }
  .c-actions button[disabled]:hover { border-color:var(--line); color:var(--muted); }
  .badge { font-size:.72rem; color:var(--muted); }
  .media { display:flex; gap:.6rem; flex-wrap:wrap; padding:.9rem 1.1rem; }
  .media figure { margin:0; width:8.5rem; }
  .media img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:0; border:1px solid var(--line); background:#fff; }
  .media figcaption { display:flex; gap:.3rem; align-items:center; margin-top:.25rem; }
  .media figcaption code { flex:1; font:.68rem ui-monospace,Consolas,monospace; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .media figcaption button { padding:.1rem .4rem; font-size:.72rem; background:none; color:var(--muted); border:1px solid var(--line); }
  /* Gestor de imágenes de modelo (marketing) */
  .mi table td { white-space:normal; overflow:visible; max-width:none; vertical-align:middle; }
  .mi tbody tr:hover { background:transparent; cursor:default; }
  .mi-thumb { width:5.5rem; }
  .mi-thumb img { width:5rem; aspect-ratio:1/1; object-fit:cover; border-radius:0; border:1px solid var(--line); background:#fff; display:block; }
  .mi-thumb .ph { width:5rem; aspect-ratio:1/1; border-radius:0; background:#eceef3; display:grid; place-items:center;
    color:var(--muted); font-size:.62rem; text-align:center; }
  .mi-ref { font:.8rem ui-monospace,Consolas,monospace; color:var(--muted); }
  .mi-url { width:100%; min-width:13rem; }
  .mi-actions { white-space:nowrap; text-align:right; }
  .mi-actions button { margin-left:.35rem; }
  .mi-actions .del { color:var(--err); border-color:var(--line); background:transparent; }
  .mi-actions .del:hover { border-color:var(--err); }
  /* ---------- Web / Lookbook ---------- */
  .block[data-kind="lb-hero"] .c-thumb { aspect-ratio:3.4/1; }
  .block[data-kind="lb-story"] .c-thumb { aspect-ratio:4/3; }
  .lb-body { flex:1 1 100%; }
  .lb-body textarea { width:100%; min-height:4.4rem; resize:vertical; font:inherit; font-size:.82rem;
    padding:.4rem .55rem; border-radius:0; border:1px solid var(--line); background:#fff; }
  .lb-body textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(236,48,19,.18); outline:none; }
  .lb-color { flex-direction:row !important; align-items:center; gap:.4rem; align-self:end; padding-bottom:.15rem; }
  .lb-color input[type=color] { width:2.3rem; height:1.95rem; padding:.1rem; border:1px solid var(--line);
    border-radius:0; background:#fff; cursor:pointer; }
  .lb-color input[type=text] { width:6rem; font:.76rem ui-monospace,Consolas,monospace; }
  .lb-refs { flex:1 1 100%; border:1px dashed var(--line); border-radius:0; padding:.6rem .7rem; background:#fff; }
  .lb-refs-title { font-size:.72rem; color:var(--muted); margin-bottom:.45rem; display:flex; gap:.5rem; align-items:center; }
  .lb-chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.5rem; }
  .lb-chips:empty { display:none; }
  .lb-chip { display:inline-flex; align-items:center; gap:.4rem; background:#f0f4ff; border:1px solid #d8e0ff;
    border-radius:999px; padding:.12rem .35rem .12rem .12rem; font-size:.78rem; }
  .lb-chip img { width:1.5rem; height:1.5rem; border-radius:50%; object-fit:cover; background:#eceef3; }
  .lb-chip .miss { color:var(--err); font:.72rem ui-monospace,Consolas,monospace; }
  .lb-chip .x { background:none; border:none; color:var(--muted); cursor:pointer; padding:0 .15rem; font-size:.95rem; line-height:1; }
  .lb-chip .x:hover { color:var(--err); }
  .lb-picker { position:relative; max-width:26rem; }
  .lb-picker input { width:100%; font-size:.82rem; padding:.4rem .55rem; }
  .lb-picker-list { position:absolute; z-index:6; left:0; right:0; top:calc(100% + .2rem); background:#fff;
    border:1px solid var(--line); border-radius:0; box-shadow:var(--shadow); max-height:15rem; overflow-y:auto; display:none; }
  .lb-picker-list.on { display:block; }
  .lb-picker-list button { display:flex; align-items:center; gap:.5rem; width:100%; text-align:left; background:none;
    border:none; border-bottom:1px solid var(--line); padding:.4rem .55rem; font:inherit; font-size:.8rem; font-weight:500; cursor:pointer; }
  .lb-picker-list button:hover { background:#f0f4ff; }
  .lb-picker-list button:last-child { border-bottom:none; }
  .lb-picker-list img, .lb-picker-list .ph { width:1.9rem; height:1.9rem; border-radius:0; object-fit:cover; background:#eceef3; flex:none; }
  .lb-picker-list .ref { color:var(--muted); font:.72rem ui-monospace,Consolas,monospace; margin-left:auto; padding-left:.5rem; }
  .lb-picker-empty { padding:.5rem .6rem; color:var(--muted); font-size:.78rem; }
  .block-actions { display:inline-flex; gap:.6rem; white-space:nowrap; }
  .c-hint { flex:1 1 100%; font-size:.72rem; color:var(--muted); margin-top:-.1rem; }
  .lb-hintlabel { font-weight:400; color:var(--muted); }
  /* Vista previa en vivo de la historia dentro del editor */
  .lbp-wrap { flex:1 1 100%; margin-bottom:.3rem; }
  .lbp-label { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.25rem; }
  .lbp { display:flex; align-items:center; gap:.7rem; background:#fbfcfe; border:1px solid var(--line); border-radius:0; padding:.55rem .65rem; }
  .lbp-img { width:5.5rem; flex:none; aspect-ratio:4/3; border-radius:0; overflow:hidden; background:#eceef3; }
  .lbp-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .lbp-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:.2rem; }
  .lbp-kicker { align-self:flex-start; font-size:.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    border-bottom:2px solid currentColor; padding-bottom:.1rem; }
  .lbp-title { font-size:.98rem; font-weight:650; line-height:1.15; letter-spacing:-.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbp-count { font-size:.68rem; color:var(--muted); }

  #flash { position:fixed; left:50%; bottom:1.4rem; translate:-50% 0; z-index:20; padding:.6rem 1.1rem; border-radius:0;
    box-shadow:var(--shadow); font-size:.85rem; display:none; max-width:min(46rem,90vw); }
  #flash.on { display:block; }
  #flash.ok { background:var(--ok-bg); color:var(--ok); }
  #flash.err { background:var(--err-bg); color:var(--err); }

  /* ---------- Modal ---------- */
  #modal { position:fixed; inset:0; background:rgba(13,16,24,.45); display:none; align-items:center; justify-content:center; padding:2rem; }
  #modal.on { display:flex; }
  #modal .box { background:var(--card); border-radius:0; box-shadow:var(--shadow); width:min(52rem,95vw); max-height:88vh;
    display:flex; flex-direction:column; }
  #modal header { display:flex; align-items:center; gap:.8rem; padding:.9rem 1.2rem; border-bottom:1px solid var(--line); }
  #modal header h3 { margin:0; font-size:.95rem; }
  #modal header .muted { font-size:.78rem; }
  #modal header button { margin-left:auto; }
  #modal pre { margin:0; padding:1rem 1.2rem; overflow:auto; font-size:.8rem; line-height:1.5; }
/* CRUD manual del CMS */
.ed-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.9rem 1.2rem; }
.ed-field { display:flex; flex-direction:column; gap:.25rem; min-width:0; }
.ed-field.wide { grid-column:1 / -1; }
.ed-field label.grow { display:flex; flex-direction:column; gap:.3rem; font-size:.82rem; font-weight:600; }
.ed-field input, .ed-field select, .ed-field textarea {
  font:inherit; padding:.5rem .6rem; border:2px solid var(--line,#e5e5e5); border-radius:0; background:#fff; width:100%; }
.ed-field select[multiple] { padding:.2rem; }
.ed-field .chk { flex-direction:row; align-items:center; gap:.4rem; }
.ed-field .help { font-weight:400; color:#777; font-size:.75rem; }
@media (max-width:720px){ .ed-grid { grid-template-columns:1fr; } }
/* Shell responsive del CMS */

/* ---------- helpers de payload ---------- */
function dig(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
// "name.es_ES|name" → primer valor no vacío
function pick(payload, paths) {
  for (const p of paths.split('|')) {
    const v = dig(payload, p);
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return undefined;
}
const shortId = v => typeof v === 'string' && v.length > 20 ? `<code class="id" title="${v}">${v.slice(0,8)}…</code>` : (v ?? '—');
const fmt = {
  text: v => v === undefined ? '—' : String(v),
  id: v => v === undefined ? '—' : shortId(v),
  bool: v => v === undefined ? '—' : (v ? '<span class="chip ok">Sí</span>' : '<span class="chip err">No</span>'),
  arr: v => Array.isArray(v) && v.length ? v.map(x => `<span class="chip plain">${x}</span>`).join(' ') : '—',
  money: (v, row) => v === undefined ? '—' : Number(v).toLocaleString('es-ES', {minimumFractionDigits:2}) + ' ' + (pick(row, 'offerData.basePrice.code|basePrice.code|currency') || '€'),
  date: v => v ? String(v).slice(0, 10) : '—',
  status: v => {
    if (!v) return '—';
    const map = { open:'info', 'partially-shipped':'warn', shipped:'ok', invoiced:'ok', canceled:'err', SCHEDULED:'info', REPLENISHMENT:'plain', PVD:'info', PVP:'warn' };
    return `<span class="chip ${map[v] || 'plain'}">${v}</span>`;
  },
};

/* ---------- API ---------- */
// El CMS es exclusivo del rol "admin": el token del portal (client-admin) autentica
// pero no autoriza, y el servidor responde 403. Se distingue de la sesión caducada
// (401) porque volver a entrar con ese usuario no arregla nada.
const SIN_PERMISO = 'Este usuario no tiene permisos de administración. '
  + 'Entra con una cuenta de administrador del CMS.';

async function api(path) {
  const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); throw new Error('401'); }
  if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ---------- auth ---------- */
async function login() {
  $('loginError').textContent = '';
  const res = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: $('email').value, password: $('password').value, type:'global', longDuration:true })
  });
  if (!res.ok) { $('loginError').textContent = 'Credenciales incorrectas'; return; }
  token = (await res.json()).token;
  const who = $('email').value;
  // Se guardan las DOS claves (b2b_* del CMS y mng_* de Gestión) para compartir sesión.
  sessionStorage.setItem('b2b_token', token); sessionStorage.setItem('mng_token', token);
  sessionStorage.setItem('b2b_who', who); sessionStorage.setItem('mng_who', who);
  enter();
}
function logout() {
  token = ''; sessionStorage.clear();
  $('app').classList.remove('on'); $('login-screen').style.display = '';
}
// 403: la sesión es válida, lo que falta es el rol. Se sale del CMS y se dice por qué.
function denied() {
  logout();
  $('loginError').textContent = SIN_PERMISO;
}
function enter() {
  $('login-screen').style.display = 'none';
  $('app').classList.add('on');
  const who = sessionStorage.getItem('b2b_who') || sessionStorage.getItem('mng_who') || '';
  $('who').textContent = who;
  $('avatar').textContent = (who.trim()[0] || 'A').toUpperCase();
  loadSummary().then(() => show('dashboard'));
}

/* ---------- nav ---------- */
async function loadSummary() {

  summary = Object.fromEntries(data.items.map(i => [i.entityType, i]));
  renderNav();
}
// Iconos del menú (mismo trazo 24×24 stroke-2 que GESTIÓN, /manage/js/icons.js). Se
// mapea cada vista a un icono; así el CMS luce la MISMA barra lateral con icono-en-caja.

  image:'<rect x="3" y="4" width="18" height="16"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  pin:'<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10Z"/><circle cx="12" cy="11" r="2.2"/>',
  file:'<path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v4h4"/>',
  truck:'<path d="M3 6h11v9H3Z"/><path d="M14 9h4l3 3v3h-7Z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/>',

  layout:'<rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M9 9v11"/>',

};
const NAV_ICON = {
  dashboard:'home', modelos:'box', productos:'tag', atributos:'tag', familias:'folder', categorias:'folder',
  imagenes:'image', ofertas:'tag', stocks:'layers', ventanas:'calendar', almacenes:'box', pagos:'tag',
  clientes:'users', grupos:'users', usuariosCliente:'users', direcciones:'pin', agentes:'users', accesos:'key',
  pedidos:'file', facturas:'file', albaranes:'truck', portada:'layout', lookbook:'book',
  comunicacion:'activity', docs:'file', portal:'external', manage:'box',
};
const navIcon = key => {
  const body = NAV_SVGS[NAV_ICON[key] || 'dots'] || NAV_SVGS.dots;
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
};

function renderNav() {
  $('nav').innerHTML = NAV.map(g => {
    const items = g.items.map(([key, label, type]) => {
      const ic = navIcon(key);
      if (g.soon || key === null)
        return `<button type="button" class="nav-item soon" disabled>${ic}<span>${label}</span></button>`;
      if (key === 'docs')
        return `<a class="nav-item" href="/docs" target="_blank">${ic}<span>${label}</span></a>`;
      if (key === 'portal')
        return `<a class="nav-item" href="/es/es/dashboard" target="_blank">${ic}<span>${label}</span></a>`;
      if (key === 'manage')
        return `<a class="nav-item" href="/manage/">${ic}<span>${label}</span></a>`;
      const count = key === 'comunicacion'
        ? Object.values(summary).reduce((a, s) => a + s.count, 0)
        : (type && summary[type]?.count);
      const badge = count ? `<span class="count">${count}</span>` : '';
      return `<button type="button" class="nav-item" data-view="${key}">${ic}<span>${label}</span>${badge}</button>`;
    }).join('');
    const open = g.soon ? '' : 'open';
    return `<div class="group ${open}">
      <button class="group-title">${g.title}<span class="chev">▶</span></button>
      <div class="items">${items}</div></div>`;
  }).join('');
  document.querySelectorAll('.group-title').forEach(b =>
    b.onclick = () => b.parentElement.classList.toggle('open'));
  document.querySelectorAll('.nav-item[data-view]').forEach(el =>
    el.onclick = () => show(el.dataset.view));
  markNav();   // el dashboard repinta la nav después de show(): hay que remarcarla
}

// La vista activa se anuncia con aria-current, no solo con color
function markNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = !!current && el.dataset.view === current;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}

/* ---------- vistas ---------- */
function show(key) {
  current = key; skip = 0;
  markNav();
  const v = VIEWS[key];
  $('crumb').textContent = v.crumb;
  $('title').textContent = v.title;
  if (v.dashboard) renderDashboard();
  else if (v.content) renderContent();
  else if (v.lookbook) renderLookbook();
  else if (v.manager) renderModelImages();
  else if (v.users) renderUsers();
  else renderList();
}

async function renderDashboard() {
  await loadSummary();
  const count = t => summary[t]?.count || 0;
  const totalDocs = Object.values(summary).reduce((a, s) => a + s.count, 0);
  const last = Object.values(summary).map(s => s.lastReceivedAt).sort().pop();
  $('content').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Documentos recibidos</div><div class="value">${totalDocs}</div></div>
      <div class="kpi green"><div class="label">Modelos</div><div class="value">${count('model')}</div></div>
      <div class="kpi green"><div class="label">Productos</div><div class="value">${count('product')}</div></div>
      <div class="kpi yellow"><div class="label">Ofertas</div><div class="value">${count('offer')}</div></div>
      <div class="kpi"><div class="label">Clientes</div><div class="value">${count('client')}</div></div>
      <div class="kpi red"><div class="label">Pedidos</div><div class="value">${count('order')}</div></div>
    </div>
    <p class="muted">Última comunicación de BC: ${last ? new Date(last).toLocaleString() : '— todavía ninguna'}</p>
    <div class="card"><table>
      <thead><tr><th>Tipo</th><th>Cantidad</th><th>Última recepción</th></tr></thead>
      <tbody>${Object.values(summary).sort((a,b)=>b.count-a.count).map(s =>
        `<tr onclick="showByType('${s.entityType}')"><td>${s.entityType}</td><td>${s.count}</td>
         <td>${new Date(s.lastReceivedAt).toLocaleString()}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">BC aún no ha enviado nada — lanza una sincronización desde el conector</td></tr>'}</tbody>
    </table></div>`;
}
function showByType(type) {
  const entry = Object.entries(VIEWS).find(([,v]) => v.type === type);
  show(entry ? entry[0] : 'comunicacion');
}

async function renderList() {

  $('content').innerHTML = `

      <button class="btn-ghost" id="reload">↻ Actualizar</button>
      ${canEdit ? `<button class="btn-primary" id="newBtn">+ Nuevo · ${esc(EDIT[v.type].singular.toLowerCase())}</button>` : ''}
      <div class="spacer"></div><span class="muted" id="count"></span>
    </div>
    ${canEdit ? '' : '<p class="muted" style="margin:-.4rem 0 .8rem">Solo lectura: esta entidad la sincroniza el conector. Al pulsar una fila verás su JSON.</p>'}

      </table></div>
      <div class="pager">
        <button class="btn-ghost" id="prev">←</button><span class="muted" id="page"></span><button class="btn-ghost" id="next">→</button>
      </div>
    </div>`;
  $('reload').onclick = () => { loadSummary(); loadPage(); };
  if (canEdit) $('newBtn').onclick = () => gotoManage(v.type, null);
  $('q').oninput = renderRows;
  $('prev').onclick = () => { if (skip >= PAGE) { skip -= PAGE; loadPage(); } };
  $('next').onclick = () => { if (skip + PAGE < total) { skip += PAGE; loadPage(); } };
  await loadPage();
}

async function loadPage() {
  const v = VIEWS[current];
  const q = new URLSearchParams({ skip, take: PAGE, includePayload: true });
  if (v.type) q.set('entityType', v.type);
  const data = await api('/api/admin/sync-documents?' + q);
  total = data.total;
  rowsCache = data.items.map(d => {
    let payload = {};
    try { payload = JSON.parse(d.payload); } catch {}
    if (Array.isArray(payload)) payload = payload[0] ?? {};
    payload.__externalId = d.externalId; payload.__parentId = d.parentId;
    payload.__entityType = d.entityType; payload.__last = new Date(d.lastReceivedAt).toLocaleString();
    return { doc: d, payload };
  });
  $('count').textContent = `${total} registros`;
  $('page').textContent = `${Math.floor(skip/PAGE)+1} / ${Math.max(1, Math.ceil(total/PAGE))}`;
  renderRows();
}

function renderRows() {
  const v = VIEWS[current];
  const q = ($('q')?.value || '').toLowerCase();
  const rows = rowsCache.filter(r => !q || JSON.stringify(r.payload).toLowerCase().includes(q));
  $('rows').innerHTML = rows.map((r, i) => {
    const cells = v.cols.map(([, path, f]) => `<td>${fmt[f](pick(r.payload, path), r.payload)}</td>`).join('');
    return `<tr data-i="${i}">${cells}<td class="muted">${r.payload.__last}</td></tr>`;
  }).join('') || `<tr><td colspan="${v.cols.length+1}" class="empty">
      ${q ? 'Sin resultados con ese filtro' : 'BC todavía no ha enviado nada de este tipo'}</td></tr>`;
  const editable = EDITABLE.has(v.type);
  document.querySelectorAll('#rows tr[data-i]').forEach(tr =>
    tr.onclick = () => editable ? gotoManage(v.type, rows[tr.dataset.i].payload.__externalId)
      : v.type === 'order' ? gotoManage('order', rows[tr.dataset.i].payload.__externalId)
      : openDetail(rows[tr.dataset.i]));
}

/* ---- utilidades de esquema ---- */
const LOCS4 = ['es_ES','en_EN','fr_FR','it_IT'];
const slugify = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

function setPath(obj, path, val) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i], nextIdx = /^\d+$/.test(keys[i+1]);
    if (o[k] == null) o[k] = nextIdx ? [] : {};
    o = o[k];
  }
  o[keys[keys.length - 1]] = val;
}

// Opciones de FK: se cargan una vez por tipo y se cachean
const optionsCache = {};
async function loadFkOptions(type) {
  if (optionsCache[type]) return optionsCache[type];
  const q = new URLSearchParams({ entityType: type, take: 200, includePayload: true });
  const data = await api('/api/admin/sync-documents?' + q).catch(() => ({ items: [] }));
  const label = OPT_LABEL[type] || '__externalId';
  optionsCache[type] = (data.items || []).map(d => {
    let p = {}; try { p = JSON.parse(d.payload); } catch {}
    if (Array.isArray(p)) p = p[0] ?? {};
    p.__externalId = d.externalId;
    return { value: d.externalId, label: pick(p, label) || d.externalId };
  }).sort((a, b) => String(a.label).localeCompare(String(b.label)));
  return optionsCache[type];
}

/* ---- editor ---- */
let editing = null;   // { type, id (o null si nuevo), payload }

async function openEditor(type, row) {
  editing = {
    type,
    id: row ? row.payload.__externalId : null,
    parentId: row ? (row.payload.__parentId || null) : null,
    payload: row ? structuredClone(stripMeta(row.payload)) : {},
  };
  // Precarga de todas las FK que use el esquema
  const srcs = [...new Set(EDIT[type].fields.filter(f => f.src).map(f => f.src))];
  await Promise.all(srcs.map(loadFkOptions));
  paintEditor();
}
const stripMeta = p => { const c = { ...p }; for (const k of Object.keys(c)) if (k.startsWith('__')) delete c[k]; return c; };

function paintEditor() {
  const sc = EDIT[editing.type], p = editing.payload;
  const title = editing.id ? `Editar ${sc.singular.toLowerCase()}` : `Nuevo · ${sc.singular.toLowerCase()}`;
  $('content').innerHTML = `
    <div class="toolbar">
      <button class="btn-ghost" id="edBack">← Volver al listado</button>
      <div class="spacer"></div>
      ${editing.id ? `<span class="muted">id: <code class="id" title="${esc(editing.id)}">${esc(String(editing.id).slice(0,12))}…</code></span>` : ''}
    </div>
    <div class="card block">
      <header><h2>${title}</h2>
        <div class="spacer"></div>
        <span class="block-actions">
          ${editing.id ? '<button class="btn-ghost" id="edDelete">Eliminar</button>' : ''}
          <button class="btn-ghost" id="edRaw">Avanzado (JSON)</button>
          <button class="btn-primary" id="edSave">Guardar</button>
        </span>
      </header>
      <div class="ed-grid">${sc.fields.map(f => fieldHtml(f, p)).join('')}</div>
      <div id="edRawBox" style="display:none;margin-top:1rem">
        <label class="grow">JSON completo (lo que se guardará; edítalo con cuidado)
          <textarea id="edRawText" rows="12" style="width:100%;font-family:monospace"></textarea></label>
      </div>
    </div>`;
  $('edBack').onclick = () => show(current);
  $('edSave').onclick = saveEditor;
  $('edRaw').onclick = toggleRaw;
  if (editing.id) $('edDelete').onclick = deleteEditor;
}

function fieldHtml(f, p) {
  const cur = f.k.startsWith('__') ? '' : dig(p, f.k);
  const id = 'f_' + f.k.replace(/[^a-z0-9]/gi, '_');
  const help = f.help ? `<span class="help">${esc(f.help)}</span>` : '';
  const wide = (f.t === 'area' || f.t === 'valuelist' || f.t === 'multi') ? ' wide' : '';
  let control;
  if (f.t === 'bool') {
    const on = cur === undefined ? !!f.def : !!cur;
    control = `<label class="chk"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${esc(f.l)}</label>`;
    return `<div class="ed-field${wide}">${control}${help}</div>`;
  }
  if (f.t === 'i18n')      control = `<input type="text" id="${id}" value="${esc(pick(p, f.k + '.es_ES') ?? '')}">`;
  else if (f.t === 'area') control = `<textarea id="${id}" rows="3">${esc(pick(p, f.k + '.es_ES') ?? (typeof cur === 'string' ? cur : ''))}</textarea>`;
  else if (f.t === 'num')  control = `<input type="number" step="any" id="${id}" value="${esc(f.k.includes('.') ? (dig(p, f.k) ?? '') : (cur ?? ''))}">`;
  else if (f.t === 'date') control = `<input type="date" id="${id}" value="${esc(String(cur || '').slice(0,10))}">`;
  else if (f.t === 'money') control = `<input type="number" step="any" id="${id}" value="${esc(dig(p, f.k + '.value') ?? '')}">`;
  else if (f.t === 'valuelist') {
    const vals = Array.isArray(cur) ? cur.map(v => (v && typeof v === 'object') ? v.id : v).join('\n') : '';
    control = `<textarea id="${id}" rows="4">${esc(vals)}</textarea>`;
  }
  else if (f.t === 'sel' || f.t === 'multi') {
    const opts = f.opts ? OPTS[f.opts] : (optionsCache[f.src] || []).map(o => [o.value, o.label]);
    const selected = f.t === 'multi' ? (Array.isArray(cur) ? cur.map(String) : []) : String(cur ?? '');
    const optHtml = (f.t === 'sel' && !f.req && !f.opts ? [['','—']] : []).concat(opts)
      .map(([v, l]) => `<option value="${esc(v)}" ${f.t === 'multi' ? (selected.includes(String(v)) ? 'selected' : '') : (selected === String(v) ? 'selected' : '')}>${esc(l)}</option>`).join('');
    control = `<select id="${id}" ${f.t === 'multi' ? 'multiple size="4"' : ''}>${optHtml}</select>`;
  }
  else control = `<input type="text" id="${id}" value="${esc(cur ?? '')}">`;
  return `<div class="ed-field${wide}"><label class="grow">${esc(f.l)}${f.req ? ' *' : ''}${control}</label>${help}</div>`;
}

function collectPayload() {
  const sc = EDIT[editing.type];
  const p = structuredClone({ ...(sc.defaults || {}), ...editing.payload });
  for (const f of sc.fields) {
    const el = $('f_' + f.k.replace(/[^a-z0-9]/gi, '_'));
    if (!el) continue;
    if (f.t === 'bool') { setPath(p, f.k, el.checked); continue; }
    if (f.k.startsWith('__')) { p[f.k] = el.value.trim(); continue; }   // solo para el id; se quita luego
    const raw = el.value;
    if (f.t === 'i18n' || f.t === 'area') {
      const v = raw.trim();
      if (f.t === 'i18n') { const o = {}; for (const l of LOCS4) o[l] = v; setPath(p, f.k, o); }
      else { const o = {}; for (const l of LOCS4) o[l] = v; setPath(p, f.k, o); }
    } else if (f.t === 'num') { setPath(p, f.k, raw === '' ? 0 : Number(raw)); }
    else if (f.t === 'money') { setPath(p, f.k, { code:'EUR', value: raw === '' ? 0 : Number(raw) }); }
    else if (f.t === 'multi') { setPath(p, f.k, [...el.selectedOptions].map(o => o.value).filter(Boolean)); }
    else if (f.t === 'valuelist') {
      const items = raw.split(/[\n,]/).map(s => s.trim()).filter(Boolean).map((id, order) => ({ order, id }));
      setPath(p, f.k, items);
    }
    else if (f.t === 'sel') { if (raw) setPath(p, f.k, raw); else if (dig(p, f.k) !== undefined) setPath(p, f.k, null); }
    else { const v = raw.trim(); if (v || dig(p, f.k) !== undefined) setPath(p, f.k, v); }
  }
  return p;
}

function computeId(p) {
  if (editing.id) return editing.id;                 // editar: nunca se regenera
  const src = EDIT[editing.type].idFrom;
  if (src.mode === 'guid') return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  const base = String(dig(p, src.from) || '').trim();
  return src.mode === 'slug' ? slugify(base) : base;
}

async function saveEditor() {
  try {
    let p;
    if ($('edRawBox').style.display !== 'none') {
      p = JSON.parse($('edRawText').value);           // modo avanzado: manda el JSON tal cual
    } else {
      p = collectPayload();
      const missing = EDIT[editing.type].fields.filter(f => f.req).find(f => {
        const el = $('f_' + f.k.replace(/[^a-z0-9]/gi, '_'));
        return !el || (f.t === 'multi' ? ![...el.selectedOptions].length : !String(el.value).trim());
      });
      if (missing) { flash(`Falta un campo obligatorio: ${missing.l}`, 'err'); return; }
    }
    const sc = EDIT[editing.type];
    const parentId = sc.parentFrom ? (String(p[sc.parentFrom] || '').trim() || null) : (editing.parentId || null);
    const id = computeId(p);
    if (!id) { flash('No se pudo determinar el id del registro.', 'err'); return; }
    for (const k of Object.keys(p)) if (k.startsWith('__')) delete p[k];   // limpia campos auxiliares
    const url = `/api/admin/entities/${editing.type}/${encodeURIComponent(id)}`
      + (parentId ? `?parentId=${encodeURIComponent(parentId)}` : '');
    await apiSend('PUT', url, p);
    flash(`${EDIT[editing.type].singular}: guardado.`);
    optionsCache[editing.type] = null;                // la FK pudo cambiar
    editing = null;
    show(current);
  } catch (e) { flash(e.message, 'err'); }
}

async function deleteEditor() {
  if (!confirm(`¿Eliminar este registro? Desaparecerá del portal.`)) return;
  try {
    await apiSend('DELETE', `/api/admin/entities/${editing.type}/${encodeURIComponent(editing.id)}`);
    flash(`${EDIT[editing.type].singular}: eliminado.`);
    optionsCache[editing.type] = null;
    editing = null;
    show(current);
  } catch (e) { flash(e.message, 'err'); }
}

function toggleRaw() {
  const box = $('edRawBox');
  if (box.style.display === 'none') {
    $('edRawText').value = JSON.stringify(collectPayload(), null, 2);
    box.style.display = '';
  } else box.style.display = 'none';
}

const ORDER_STATUSES = [
  ['open','Abierto'],['shipped','Enviado'],['partially-shipped','Envío parcial'],

function openOrderPanel(row) {

  $('content').innerHTML = `
    <div class="toolbar">
      <button class="btn-ghost" id="ordBack">← Volver a pedidos</button>
      <div class="spacer"></div>
      <span class="muted">Origen: ${esc(pick(p,'source') || 'ERP')}</span>

    <div class="card block">
      <header><h2>Pedido ${esc(num)}</h2>
        <div class="spacer"></div>
        <span class="block-actions">
          <label class="grow" style="font-size:.82rem;font-weight:600">Estado
            <select id="ordStatus">${ORDER_STATUSES.map(([v,l]) =>
              `<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('')}</select></label>
          <button class="btn-primary" id="ordSave" style="align-self:end">Guardar estado</button>
          <button class="del" id="ordDel" style="align-self:end">Eliminar</button>
        </span>
      </header>
      <div class="ed-grid">
        <div class="ed-field"><label class="grow">Ref. de cliente<input value="${esc(pick(p,'purchaseOrderId|reference')||'')}" disabled></label></div>
        <div class="ed-field"><label class="grow">Forma de pago<input value="${esc(pick(p,'payMethodId')||'')}" disabled></label></div>
        <div class="ed-field"><label class="grow">Fecha<input value="${esc(String(pick(p,'orderedDate')||'').slice(0,10))}" disabled></label></div>
        <div class="ed-field"><label class="grow">Total<input value="${money(total)}" disabled></label></div>
      </div>
      <div style="overflow-x:auto;margin-top:1rem"><table>
        <thead><tr><th>Artículo</th><th>SKU</th><th>Uds</th><th>Precio</th><th>Importe</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
  $('ordBack').onclick = () => show(current);
  $('ordSave').onclick = async () => {
    try {
      await apiSend('PUT', `/api/admin/orders/${encodeURIComponent(id)}/status`, { status: $('ordStatus').value });
      flash('Estado del pedido actualizado.');
      show(current);
    } catch (e) { flash(e.message, 'err'); }
  };
  $('ordDel').onclick = async () => {
    if (!confirm('¿Eliminar este pedido? Desaparecerá del portal.')) return;
    try {
      await apiSend('DELETE', `/api/admin/orders/${encodeURIComponent(id)}`);
      flash('Pedido eliminado.');
      show(current);
    } catch (e) { flash(e.message, 'err'); }
  };
}

async function userAction(id, act) {
