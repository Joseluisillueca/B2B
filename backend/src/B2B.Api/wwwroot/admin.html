<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B Platform — Admin</title>
<style>
  :root {
    --side:#101218; --side-2:#181b23; --side-text:#c8cdd7; --side-active:#ffffff;
    --bg:#f4f5f8; --card:#ffffff; --line:#e6e8ee; --text:#171c26; --muted:#6b7280;
    --accent:#2f4bff; --accent-2:#1e34c9; --ok:#127a3d; --ok-bg:#e3f5ea;
    --warn:#8a6100; --warn-bg:#fdf3d7; --err:#b3261e; --err-bg:#fde7e5;
    --info:#1d4ed8; --info-bg:#e5edff;
    --r:12px; --shadow:0 1px 2px rgba(16,18,24,.06), 0 8px 24px -12px rgba(16,18,24,.12);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }

  /* ---------- Login ---------- */
  #login-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1b2340 0%,#2f4bff 55%,#5a74ff 100%); }
  .login-card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:2.2rem; width:min(22rem,90vw);
    display:flex; flex-direction:column; gap:.8rem; }
  .login-card .brand { text-align:center; font-weight:800; font-size:1.5rem; letter-spacing:-.03em; margin-bottom:.6rem; }
  .login-card .brand span { color:var(--accent); }
  .login-card input { width:100%; }
  input, select { font:inherit; padding:.6rem .75rem; border-radius:9px; border:1px solid var(--line); background:#fff; }
  input:focus-visible, select:focus-visible, button:focus-visible, .nav-item:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  .nav-item:focus-visible { outline-color:#fff; outline-offset:-2px; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,75,255,.15); }
  button { font:inherit; font-weight:600; padding:.6rem 1rem; border-radius:9px; border:1px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:var(--accent-2); }
  .btn-ghost { background:transparent; color:var(--accent); border-color:var(--line); }
  .btn-ghost:hover { border-color:var(--accent); }
  .error { color:var(--err); font-size:.85rem; min-height:1.2em; margin:0; }

  /* ---------- Shell ---------- */
  #app { display:none; height:100vh; }
  #app.on { display:grid; grid-template-columns:15.5rem 1fr; }
  aside { background:var(--side); color:var(--side-text); overflow-y:auto; display:flex; flex-direction:column; }
  aside .logo { padding:1.15rem 1.25rem .9rem; font-weight:800; font-size:1.12rem; letter-spacing:-.02em; color:#fff; }
  aside .logo span { color:#7d92ff; }
  nav { flex:1; padding:.3rem .6rem 1rem; }
  .group-title { display:flex; align-items:center; gap:.6rem; width:100%; padding:.55rem .65rem; border-radius:8px;
    background:none; border:none; color:var(--side-text); font-weight:600; font-size:.82rem; text-align:left; cursor:pointer; }
  .group-title:hover { background:var(--side-2); color:#fff; }
  .group-title .chev { margin-left:auto; transition:transform .15s; font-size:.7rem; opacity:.6; }
  .group.open .chev { transform:rotate(90deg); }
  .group .items { display:none; }
  .group.open .items { display:block; }
  /* Los ítems son <button>: font/border/background/width los devuelven al estilo del panel.
     Ojo con el orden — font:inherit va antes de font-size o se lo lleva por delante. */
  .nav-item { font:inherit; display:flex; align-items:center; gap:.5rem; padding:.42rem .65rem .42rem 2.1rem;
    border-radius:8px; color:var(--side-text); text-decoration:none; font-size:.86rem; cursor:pointer;
    border:none; background:none; width:100%; text-align:left; }
  .nav-item:hover { background:var(--side-2); color:#fff; }
  .nav-item.active, .nav-item[aria-current="page"] { background:var(--accent); color:#fff; font-weight:600; }
  .nav-item .count { margin-left:auto; font-size:.72rem; background:var(--side-2); border-radius:999px; padding:.05rem .5rem; }
  .nav-item.active .count { background:rgba(255,255,255,.22); }
  .nav-item.soon { opacity:.38; cursor:default; }
  .nav-item.soon:hover { background:none; color:var(--side-text); }
  aside footer { padding: .9rem 1.25rem; border-top:1px solid #23262f; display:flex; align-items:center; gap:.6rem; }
  aside footer .who { font-size:.8rem; overflow:hidden; text-overflow:ellipsis; }
  aside footer button { margin-left:auto; background:#2a1215; color:#ff9d95; border:1px solid #532027; padding:.35rem .7rem; font-size:.78rem; }

  main { overflow-y:auto; padding:1.6rem 2rem 3rem; }
  .crumb { color:var(--muted); font-size:.8rem; margin-bottom:.2rem; }
  h1 { margin:.1rem 0 1.1rem; font-size:1.7rem; letter-spacing:-.03em; }

  .toolbar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem; }
  .toolbar input[type=search] { min-width:18rem; }
  .toolbar .spacer { flex:1; }
  .muted { color:var(--muted); font-size:.85rem; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.9rem; margin-bottom:1.4rem; }
  .kpi { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:.95rem 1.1rem; border-left:4px solid var(--accent); }
  .kpi .label { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; }
  .kpi .value { font-size:1.55rem; font-weight:750; letter-spacing:-.02em; margin-top:.15rem; }
  .kpi.green { border-left-color:#18a558; } .kpi.yellow { border-left-color:#eab308; } .kpi.red { border-left-color:#dc2626; }

  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.87rem; }
  thead th { position:sticky; top:0; background:linear-gradient(180deg,var(--accent),var(--accent-2)); color:#fff;
    font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; text-align:left; padding:.6rem .8rem; }
  tbody td { padding:.55rem .8rem; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:18rem; }
  tbody tr:hover { background:#f0f4ff; cursor:pointer; }
  tbody tr:last-child td { border-bottom:none; }
  .chip { display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.74rem; font-weight:650; }
  .chip.ok { background:var(--ok-bg); color:var(--ok); } .chip.err { background:var(--err-bg); color:var(--err); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); } .chip.info { background:var(--info-bg); color:var(--info); }
  .chip.plain { background:#eef0f4; color:#374151; }
  .empty { padding:2.4rem; text-align:center; color:var(--muted); }
  code.id { font:.78rem ui-monospace,Consolas,monospace; color:var(--muted); }

  .pager { display:flex; gap:.5rem; align-items:center; justify-content:flex-end; padding:.6rem .8rem; border-top:1px solid var(--line); }
  .pager button { padding:.3rem .7rem; }

  /* ---------- Web / Portada ---------- */
  .tabs { display:flex; gap:.3rem; background:#e9ebf1; padding:.25rem; border-radius:10px; }
  .tabs button { background:none; color:var(--muted); padding:.35rem .9rem; border-radius:8px; font-size:.85rem; }
  .tabs button.on { background:#fff; color:var(--text); box-shadow:var(--shadow); }
  .block { margin-bottom:1.4rem; }
  .block > header { display:flex; align-items:center; gap:.8rem; padding:.9rem 1.1rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .block > header h2 { margin:0; font-size:1rem; }
  .block > header .spacer { flex:1; }
  .block .help { color:var(--muted); font-size:.8rem; }
  .c-list { padding:.9rem 1.1rem; display:flex; flex-direction:column; gap:.9rem; }
  .c-item { display:grid; grid-template-columns:9.5rem 1fr auto; gap:.9rem; align-items:start;
    border:1px solid var(--line); border-radius:10px; padding:.8rem; background:#fbfcfe; }
  .c-item.off { opacity:.55; }
  .c-thumb { aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#eceef3; display:grid; place-items:center;
    color:var(--muted); font-size:.72rem; text-align:center; }
  /* La miniatura enseña el recorte real: el hero del portal es 3,4:1, no 16:9 */
  .block[data-kind="hero"] .c-thumb { aspect-ratio:3.4/1; }
  .c-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .c-row { display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:.55rem; }
  .c-row:last-child { margin-bottom:0; }
  .c-item label { display:flex; flex-direction:column; gap:.2rem; font-size:.72rem; color:var(--muted); }
  .c-item label.grow { flex:1; min-width:9rem; }
  .c-item label.chk { flex-direction:row; align-items:center; gap:.35rem; font-size:.8rem; color:var(--text); align-self:end; padding-bottom:.5rem; }
  .c-item input, .c-item select { font-size:.82rem; padding:.4rem .55rem; }
  .c-actions { display:flex; flex-direction:column; gap:.35rem; }
  .c-actions button { padding:.3rem .6rem; font-size:.78rem; background:#fff; border:1px solid var(--line); color:var(--muted); }
  .c-actions button:hover { border-color:var(--accent); color:var(--accent); }
  .c-actions button.del:hover { border-color:var(--err); color:var(--err); }
  .c-actions button[disabled] { opacity:.35; cursor:default; }
  .c-actions button[disabled]:hover { border-color:var(--line); color:var(--muted); }
  .badge { font-size:.72rem; color:var(--muted); }
  .media { display:flex; gap:.6rem; flex-wrap:wrap; padding:.9rem 1.1rem; }
  .media figure { margin:0; width:8.5rem; }
  .media img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .media figcaption { display:flex; gap:.3rem; align-items:center; margin-top:.25rem; }
  .media figcaption code { flex:1; font:.68rem ui-monospace,Consolas,monospace; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .media figcaption button { padding:.1rem .4rem; font-size:.72rem; background:none; color:var(--muted); border:1px solid var(--line); }
  #flash { position:fixed; left:50%; bottom:1.4rem; translate:-50% 0; z-index:20; padding:.6rem 1.1rem; border-radius:10px;
    box-shadow:var(--shadow); font-size:.85rem; display:none; max-width:min(46rem,90vw); }
  #flash.on { display:block; }
  #flash.ok { background:var(--ok-bg); color:var(--ok); }
  #flash.err { background:var(--err-bg); color:var(--err); }

  /* ---------- Modal ---------- */
  #modal { position:fixed; inset:0; background:rgba(13,16,24,.45); display:none; align-items:center; justify-content:center; padding:2rem; }
  #modal.on { display:flex; }
  #modal .box { background:var(--card); border-radius:14px; box-shadow:var(--shadow); width:min(52rem,95vw); max-height:88vh;
    display:flex; flex-direction:column; }
  #modal header { display:flex; align-items:center; gap:.8rem; padding:.9rem 1.2rem; border-bottom:1px solid var(--line); }
  #modal header h3 { margin:0; font-size:.95rem; }
  #modal header .muted { font-size:.78rem; }
  #modal header button { margin-left:auto; }
  #modal pre { margin:0; padding:1rem 1.2rem; overflow:auto; font-size:.8rem; line-height:1.5; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand">B2B <span>Platform</span></div>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn-primary" id="doLogin">Iniciar sesión</button>
    <p class="error" id="loginError"></p>
  </div>
</div>

<div id="app">
  <aside>
    <div class="logo">B2B <span>Platform</span></div>
    <nav id="nav"></nav>
    <footer>
      <div class="who" id="who"></div>
      <button id="logout">Salir</button>
    </footer>
  </aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <h1 id="title"></h1>
    <div id="content"></div>
  </main>
</div>

<div id="flash"></div>

<div id="modal">
  <div class="box">
    <header><h3 id="mTitle"></h3><span class="muted" id="mMeta"></span><button class="btn-ghost" onclick="closeModal()">Cerrar</button></header>
    <pre id="mBody"></pre>
  </div>
</div>

<script>
'use strict';
const PAGE = 25;
let token = sessionStorage.getItem('b2b_token') || '';
let summary = {};        // entityType -> {count,lastReceivedAt}
let current = null;      // vista activa
let skip = 0, total = 0, rowsCache = [];

const $ = id => document.getElementById(id);

/* ---------- helpers de payload ---------- */
function dig(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
// "name.es_ES|name" → primer valor no vacío
function pick(payload, paths) {
  for (const p of paths.split('|')) {
    const v = dig(payload, p);
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return undefined;
}
const shortId = v => typeof v === 'string' && v.length > 20 ? `<code class="id" title="${v}">${v.slice(0,8)}…</code>` : (v ?? '—');
const fmt = {
  text: v => v === undefined ? '—' : String(v),
  id: v => v === undefined ? '—' : shortId(v),
  bool: v => v === undefined ? '—' : (v ? '<span class="chip ok">Sí</span>' : '<span class="chip err">No</span>'),
  arr: v => Array.isArray(v) && v.length ? v.map(x => `<span class="chip plain">${x}</span>`).join(' ') : '—',
  money: (v, row) => v === undefined ? '—' : Number(v).toLocaleString('es-ES', {minimumFractionDigits:2}) + ' ' + (pick(row, 'offerData.basePrice.code|basePrice.code|currency') || '€'),
  date: v => v ? String(v).slice(0, 10) : '—',
  status: v => {
    if (!v) return '—';
    const map = { open:'info', 'partially-shipped':'warn', shipped:'ok', invoiced:'ok', canceled:'err', SCHEDULED:'info', REPLENISHMENT:'plain', PVD:'info', PVP:'warn' };
    return `<span class="chip ${map[v] || 'plain'}">${v}</span>`;
  },
};

/* ---------- definición de vistas (réplica del CMS actual) ---------- */
// col: [etiqueta, rutas de payload con |, formateador]
const VIEWS = {
  dashboard: { title:'Dashboard', crumb:'Dashboard', dashboard:true },

  modelos:   { title:'Modelos', crumb:'Productos / Modelos', type:'model', cols:[
    ['Modelo','name.es_ES|name','text'], ['Referencia','externalReference','text'],
    ['Familia','familyId','text'], ['Segmentos','productSegments','arr'], ['Activo','active','bool']]},
  productos: { title:'Productos', crumb:'Productos / Productos', type:'product', cols:[
    ['Referencia','sku|externalReference','text'], ['Nombre','name.es_ES','text'],
    ['Modelo','modelId','id'], ['Talla','attributes.tallas','text'],
    ['EAN','ean','text'], ['Activo','active','bool']]},
  atributos: { title:'Atributos', crumb:'Productos / Atributos', type:'attribute', cols:[
    ['Code','code','text'], ['Nombre','name.es_ES','text'], ['Tipo','type','text'],
    ['Formato','visibleFormat','text'], ['Visible web','visibleWeb','bool']]},
  familias:  { title:'Familias', crumb:'Productos / Familias', type:'family', cols:[
    ['Código','code','text'], ['Nombre','name.es_ES','text']]},
  categorias:{ title:'Categorías', crumb:'Productos / Categorías', type:'category', cols:[
    ['Nombre','name.es_ES','text'], ['Familias','search.familyIds','arr'], ['Activa','active','bool']]},
  imagenes:  { title:'Imágenes de modelo', crumb:'Productos / Imágenes', type:'model-image', cols:[
    ['Modelo','images.0.id','id'], ['URI','images.0.image.uri','text']]},

  ofertas:   { title:'Precios / Ofertas', crumb:'Inventario y Precios / Precios', type:'offer', cols:[
    ['Modelo','offerData.modelId|modelId','id'], ['Producto','offerData.productId|productId','id'],
    ['Cliente / Grupo','offerData.clientId|offerData.clientGroupId|clientId|clientGroupId','id'],
    ['Tipo precio','offerData.priceType|priceType','status'],
    ['Precio','offerData.basePrice.value|basePrice.value','money'],
    ['Desde uds','offerData.stock|stock','text'],
    ['Tipo pedido','offerData.orderType|orderType','status']]},
  stocks:    { title:'Stocks', crumb:'Inventario y Precios / Stocks', type:'inventory', cols:[
    ['Producto','__externalId','id'], ['Stock','stock','text'],
    ['Ventana de servicio','stockServiceId','text'], ['Tipo','orderType','status'], ['Fecha','entryDate','date']]},
  ventanas:  { title:'Servicios de stock', crumb:'Inventario y Precios / Servicios de stock', type:'service-window', cols:[
    ['Id','id|__externalId','text'], ['Nombre','name.es_ES','text'], ['Desde','from','date'],
    ['Hasta','to','date'], ['Límite','limit','date'], ['Tipo','orderType','status']]},
  almacenes: { title:'Almacenes', crumb:'Inventario y Precios / Almacenes', type:'warehouse', cols:[
    ['Código','code|__externalId','text'], ['Nombre','description.es_ES','text'],
    ['Ciudad','address.city','text'], ['País','address.countryIsoId','text'], ['Activo','active','bool']]},
  pagos:     { title:'Formas de pago', crumb:'Inventario y Precios / Formas de pago', type:'payment-method', cols:[
    ['Id','__externalId','text'], ['Nombre','name.es_ES','text'], ['Orden','order','text'],
    ['Crédito','allowCredit','bool'], ['Referencia','externalReference','text']]},

  clientes:  { title:'Clientes', crumb:'Clientes / Clientes', type:'client', cols:[
    ['Código','externalReference|clienteExternalReference','text'],
    ['Nombre','name.es_ES|name|name2','text'], ['País','address.countryIsoId|countryIsoId','text'],
    ['Segmentos','productSegments','arr'], ['Grupo','clientGroupId','text'], ['Activo','active','bool']]},
  grupos:    { title:'Grupos de clientes', crumb:'Clientes / Grupos', type:'client-group', cols:[
    ['Código','externalReference','text'], ['Nombre','name.es_ES','text'], ['Formas de pago','paymentMethods','arr']]},
  usuariosCliente: { title:'Usuarios de cliente', crumb:'Clientes / Usuarios', type:'client-user', cols:[
    ['Cliente','__externalId','id'], ['Email','email|username','text'], ['Cultura','culture','text']]},
  direcciones: { title:'Direcciones de envío', crumb:'Clientes / Direcciones', type:'shipping-address', cols:[
    ['Id','__externalId','id'], ['Cliente','__parentId','id'], ['Ciudad','city|address.city','text'],
    ['CP','zipCode|address.zipCode','text'], ['País','countryIsoId|address.countryIsoId','text']]},
  agentes:   { title:'Agentes comerciales', crumb:'Clientes / Agentes', type:'agent', cols:[
    ['Id','__externalId','id'], ['Nombre','name|firstName','text'], ['Email','email','text']]},

  pedidos:   { title:'Pedidos', crumb:'Pedidos / Pedidos', type:'order', cols:[
    ['Nº','externalReference|reference|__externalId','id'], ['Cliente','clientId','id'],
    ['Ref. cliente','purchaseOrderId','text'], ['Tipo','type','status'],
    ['Importe','totals.total.value|totals.totalAmount','money'], ['Estado','status','status']]},
  facturas:  { title:'Facturas', crumb:'Pedidos / Facturas', type:'invoice', cols:[
    ['Nº','externalReference|reference|__externalId','id'], ['Cliente','clientId','id'],
    ['Fecha','date|issueDate|createdAt','date'], ['Importe','totals.total.value|totals.totalAmount|total','money'],
    ['Estado','status','status']]},
  albaranes: { title:'Albaranes', crumb:'Pedidos / Albaranes', type:'delivery-note', cols:[
    ['Nº','externalReference|reference|__externalId','id'], ['Cliente','clientId','id'],
    ['Fecha','date|deliveryDate|createdAt','date'], ['Tracking','transportUrlTrack','text'],
    ['Estado','status','status']]},

  portada:   { title:'Portada del portal', crumb:'Web / Portada', content:true },

  comunicacion: { title:'Comunicación BC', crumb:'Salud / Comunicación', type:'', cols:[
    ['Tipo','__entityType','text'], ['Id externo','__externalId','id'], ['Recibido','__last','text']]},
};

const NAV = [
  { title:'Dashboard', items:[['dashboard','Dashboard']] },
  { title:'Productos', items:[['modelos','Modelos','model'],['productos','Productos','product'],['atributos','Atributos','attribute'],
      ['familias','Familias','family'],['categorias','Categorías','category'],['imagenes','Imágenes','model-image']] },
  { title:'Inventario y Precios', items:[['ofertas','Precios','offer'],['stocks','Stocks','inventory'],
      ['ventanas','Servicios de stock','service-window'],['almacenes','Almacenes','warehouse'],['pagos','Formas de pago','payment-method']] },
  { title:'Clientes', items:[['clientes','Clientes','client'],['grupos','Grupos de clientes','client-group'],
      ['usuariosCliente','Usuarios de cliente','client-user'],['direcciones','Direcciones envío','shipping-address'],['agentes','Agentes comerciales','agent']] },
  { title:'Pedidos', items:[['pedidos','Pedidos','order'],['facturas','Facturas','invoice'],['albaranes','Albaranes','delivery-note']] },
  { title:'Web', items:[['portada','Portada'],['portal','Ver el portal']] },
  { title:'Salud', items:[['comunicacion','Comunicación BC'],['docs','Documentación API']] },
  { title:'Próximamente', soon:true, items:[[null,'SATs / Devoluciones'],[null,'Notificaciones'],[null,'Sistema']] },
];

/* ---------- API ---------- */
// El CMS es exclusivo del rol "admin": el token del portal (client-admin) autentica
// pero no autoriza, y el servidor responde 403. Se distingue de la sesión caducada
// (401) porque volver a entrar con ese usuario no arregla nada.
const SIN_PERMISO = 'Este usuario no tiene permisos de administración. '
  + 'Entra con una cuenta de administrador del CMS.';

async function api(path) {
  const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); throw new Error('401'); }
  if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ---------- auth ---------- */
async function login() {
  $('loginError').textContent = '';
  const res = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: $('email').value, password: $('password').value, type:'global', longDuration:true })
  });
  if (!res.ok) { $('loginError').textContent = 'Credenciales incorrectas'; return; }
  token = (await res.json()).token;
  sessionStorage.setItem('b2b_token', token);
  sessionStorage.setItem('b2b_who', $('email').value);
  enter();
}
function logout() {
  token = ''; sessionStorage.clear();
  $('app').classList.remove('on'); $('login-screen').style.display = 'flex';
}
// 403: la sesión es válida, lo que falta es el rol. Se sale del CMS y se dice por qué.
function denied() {
  logout();
  $('loginError').textContent = SIN_PERMISO;
}
function enter() {
  $('login-screen').style.display = 'none';
  $('app').classList.add('on');
  $('who').textContent = sessionStorage.getItem('b2b_who') || '';
  loadSummary().then(() => show('dashboard'));
}

/* ---------- nav ---------- */
async function loadSummary() {
  const data = await api('/api/admin/summary');
  summary = Object.fromEntries(data.items.map(i => [i.entityType, i]));
  renderNav();
}
function renderNav() {
  $('nav').innerHTML = NAV.map(g => {
    const items = g.items.map(([key, label, type]) => {
      if (g.soon || key === null)
        return `<button type="button" class="nav-item soon" disabled>${label}</button>`;
      if (key === 'docs')
        return `<a class="nav-item" href="/docs" target="_blank">${label} ↗</a>`;
      if (key === 'portal')
        return `<a class="nav-item" href="/es/es/dashboard" target="_blank">${label} ↗</a>`;
      const count = key === 'comunicacion'
        ? Object.values(summary).reduce((a, s) => a + s.count, 0)
        : (type && summary[type]?.count);
      const badge = count ? `<span class="count">${count}</span>` : '';
      return `<button type="button" class="nav-item" data-view="${key}">${label}${badge}</button>`;
    }).join('');
    const open = g.soon ? '' : 'open';
    return `<div class="group ${open}">
      <button class="group-title">${g.title}<span class="chev">▶</span></button>
      <div class="items">${items}</div></div>`;
  }).join('');
  document.querySelectorAll('.group-title').forEach(b =>
    b.onclick = () => b.parentElement.classList.toggle('open'));
  document.querySelectorAll('.nav-item[data-view]').forEach(el =>
    el.onclick = () => show(el.dataset.view));
  markNav();   // el dashboard repinta la nav después de show(): hay que remarcarla
}

// La vista activa se anuncia con aria-current, no solo con color
function markNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = !!current && el.dataset.view === current;
    el.classList.toggle('active', on);
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}

/* ---------- vistas ---------- */
function show(key) {
  current = key; skip = 0;
  markNav();
  const v = VIEWS[key];
  $('crumb').textContent = v.crumb;
  $('title').textContent = v.title;
  if (v.dashboard) renderDashboard();
  else if (v.content) renderContent();
  else renderList();
}

async function renderDashboard() {
  await loadSummary();
  const count = t => summary[t]?.count || 0;
  const totalDocs = Object.values(summary).reduce((a, s) => a + s.count, 0);
  const last = Object.values(summary).map(s => s.lastReceivedAt).sort().pop();
  $('content').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Documentos recibidos</div><div class="value">${totalDocs}</div></div>
      <div class="kpi green"><div class="label">Modelos</div><div class="value">${count('model')}</div></div>
      <div class="kpi green"><div class="label">Productos</div><div class="value">${count('product')}</div></div>
      <div class="kpi yellow"><div class="label">Ofertas</div><div class="value">${count('offer')}</div></div>
      <div class="kpi"><div class="label">Clientes</div><div class="value">${count('client')}</div></div>
      <div class="kpi red"><div class="label">Pedidos</div><div class="value">${count('order')}</div></div>
    </div>
    <p class="muted">Última comunicación de BC: ${last ? new Date(last).toLocaleString() : '— todavía ninguna'}</p>
    <div class="card"><table>
      <thead><tr><th>Tipo</th><th>Cantidad</th><th>Última recepción</th></tr></thead>
      <tbody>${Object.values(summary).sort((a,b)=>b.count-a.count).map(s =>
        `<tr onclick="showByType('${s.entityType}')"><td>${s.entityType}</td><td>${s.count}</td>
         <td>${new Date(s.lastReceivedAt).toLocaleString()}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">BC aún no ha enviado nada — lanza una sincronización desde el conector</td></tr>'}</tbody>
    </table></div>`;
}
function showByType(type) {
  const entry = Object.entries(VIEWS).find(([,v]) => v.type === type);
  show(entry ? entry[0] : 'comunicacion');
}

async function renderList() {
  const v = VIEWS[current];
  $('content').innerHTML = `
    <div class="toolbar">
      <input type="search" id="q" placeholder="Filtrar en la página actual…">
      <button class="btn-ghost" id="reload">↻ Actualizar</button>
      <div class="spacer"></div><span class="muted" id="count"></span>
    </div>
    <div class="card">
      <div style="overflow-x:auto"><table>
        <thead><tr>${v.cols.map(c => `<th>${c[0]}</th>`).join('')}<th>Recibido</th></tr></thead>
        <tbody id="rows"><tr><td colspan="${v.cols.length+1}" class="empty">Cargando…</td></tr></tbody>
      </table></div>
      <div class="pager">
        <button class="btn-ghost" id="prev">←</button><span class="muted" id="page"></span><button class="btn-ghost" id="next">→</button>
      </div>
    </div>`;
  $('reload').onclick = () => { loadSummary(); loadPage(); };
  $('q').oninput = renderRows;
  $('prev').onclick = () => { if (skip >= PAGE) { skip -= PAGE; loadPage(); } };
  $('next').onclick = () => { if (skip + PAGE < total) { skip += PAGE; loadPage(); } };
  await loadPage();
}

async function loadPage() {
  const v = VIEWS[current];
  const q = new URLSearchParams({ skip, take: PAGE, includePayload: true });
  if (v.type) q.set('entityType', v.type);
  const data = await api('/api/admin/sync-documents?' + q);
  total = data.total;
  rowsCache = data.items.map(d => {
    let payload = {};
    try { payload = JSON.parse(d.payload); } catch {}
    if (Array.isArray(payload)) payload = payload[0] ?? {};
    payload.__externalId = d.externalId; payload.__parentId = d.parentId;
    payload.__entityType = d.entityType; payload.__last = new Date(d.lastReceivedAt).toLocaleString();
    return { doc: d, payload };
  });
  $('count').textContent = `${total} registros`;
  $('page').textContent = `${Math.floor(skip/PAGE)+1} / ${Math.max(1, Math.ceil(total/PAGE))}`;
  renderRows();
}

function renderRows() {
  const v = VIEWS[current];
  const q = ($('q')?.value || '').toLowerCase();
  const rows = rowsCache.filter(r => !q || JSON.stringify(r.payload).toLowerCase().includes(q));
  $('rows').innerHTML = rows.map((r, i) => {
    const cells = v.cols.map(([, path, f]) => `<td>${fmt[f](pick(r.payload, path), r.payload)}</td>`).join('');
    return `<tr data-i="${i}">${cells}<td class="muted">${r.payload.__last}</td></tr>`;
  }).join('') || `<tr><td colspan="${v.cols.length+1}" class="empty">
      ${q ? 'Sin resultados con ese filtro' : 'BC todavía no ha enviado nada de este tipo'}</td></tr>`;
  document.querySelectorAll('#rows tr[data-i]').forEach(tr =>
    tr.onclick = () => openDetail(rows[tr.dataset.i]));
}

/* ---------- Web / Portada (portal_content) ---------- */
// Editor de la portada del portal: carrusel y tarjetas de acceso, por idioma.
// Lo que se publica aquí lo lee el portal en /api/portal/content/{clave}.
const LOCALES = [['*','Común'],['es','ES'],['en','EN'],['fr','FR'],['it','IT']];
const BLOCKS = [
  { key:'dashboard.hero', title:'Carrusel de portada', kind:'hero',
    help:'Imágenes a ancho completo sobre el H1. Se pasan solas cada 6,5 s. Medida recomendada: 1600×470 px (3,4:1).' },
  { key:'dashboard.tiles', title:'Tarjetas de acceso', kind:'tiles',
    help:'Reposición y Programación: fijan la ventana de servicio del carrito y llevan al catálogo. Medida recomendada: 1200×675 px (16:9).' },
];
const WINDOWS = [['replenishment','Reposición'],['scheduled','Programación']];

let locale = '*';
let blocks = {};   // clave -> { items, updatedAt, updatedBy }
let mediaFiles = [];

const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function flash(message, kind = 'ok') {
  const box = $('flash');
  box.className = 'on ' + kind;
  box.textContent = message;
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => box.className = '', kind === 'ok' ? 3000 : 7000);
}

async function apiSend(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization:'Bearer ' + token, ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { logout(); throw new Error('Sesión caducada'); }
  if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
  return data;
}

// El backend guarda las fechas en ISO; el input las quiere en hora local sin zona
const toInput = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fromInput = value => value ? new Date(value).toISOString() : '';

async function renderContent() {
  $('content').innerHTML = '<p class="muted">Cargando la portada…</p>';
  await Promise.all([loadBlocks(), loadMedia()]);
  paintContent();
}

async function loadBlocks() {
  blocks = {};
  for (const block of BLOCKS) {
    try {
      const data = await api(`/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`);
      blocks[block.key] = { items: data.items || [], updatedAt: data.updatedAt, updatedBy: data.updatedBy };
    } catch {
      blocks[block.key] = { items: [], updatedAt: null, updatedBy: null };   // bloque aún sin publicar
    }
  }
}

async function loadMedia() {
  try { mediaFiles = (await api('/api/admin/media')).items || []; }
  catch { mediaFiles = []; }
}

function paintContent() {
  $('content').innerHTML = `
    <div class="toolbar">
      <div class="tabs">${LOCALES.map(([code, label]) =>
        `<button data-locale="${code}" class="${code === locale ? 'on' : ''}">${label}</button>`).join('')}</div>
      <span class="muted">El portal usa el idioma pedido y, si no lo tiene, el contenido <b>Común</b>.</span>
      <div class="spacer"></div>
      <a class="btn-ghost" href="/es/es/dashboard" target="_blank" style="text-decoration:none">Ver la portada ↗</a>
    </div>
    ${BLOCKS.map(paintBlock).join('')}
    <div class="card block">
      <header><h2>Imágenes subidas</h2><span class="help">Se guardan en /media/portal y las sirve el propio portal.</span></header>
      ${mediaFiles.length ? `<div class="media">${mediaFiles.map(f => `
        <figure>
          <img src="${esc(f.url)}" alt="">
          <figcaption>
            <code title="${esc(f.url)}">${esc(f.name)}</code>
            <button data-media-del="${esc(f.name)}" title="Eliminar">✕</button>
          </figcaption>
        </figure>`).join('')}</div>` : '<div class="empty">Todavía no has subido ninguna imagen</div>'}
    </div>`;

  document.querySelectorAll('[data-locale]').forEach(b =>
    b.onclick = () => { locale = b.dataset.locale; renderContent(); });
  document.querySelectorAll('[data-media-del]').forEach(b =>
    b.onclick = () => deleteMedia(b.dataset.mediaDel));
  BLOCKS.forEach(wireBlock);
}

function paintBlock(block) {
  const data = blocks[block.key];
  const stamp = data.updatedAt
    ? `Publicado el ${new Date(data.updatedAt).toLocaleString()}${data.updatedBy ? ' por ' + esc(data.updatedBy) : ''}`
    : 'Sin publicar en este idioma';

  return `
    <div class="card block" data-block="${block.key}" data-kind="${block.kind}">
      <header>
        <h2>${block.title}</h2>
        <span class="help">${block.help}</span>
        <div class="spacer"></div>
        <span class="badge">${stamp}</span>
        <button class="btn-ghost" data-action="add">+ Añadir</button>
        <button class="btn-ghost" data-action="clear">Vaciar</button>
        <button class="btn-primary" data-action="save">Publicar</button>
      </header>
      ${data.items.length
        ? `<div class="c-list">${data.items.map((item, i) => paintItem(block, item, i, data.items.length)).join('')}</div>`
        : `<div class="empty">Sin elementos. Pulsa <b>+ Añadir</b> — mientras tanto el portal
             ${block.kind === 'hero' ? 'no muestra carrusel' : 'pinta las dos tarjetas con el color de marca'}.</div>`}
    </div>`;
}

// La miniatura vacía recuerda la medida que espera el portal
const emptyThumb = kind => `<span>sin imagen<br>${kind === 'hero' ? '1600×470' : '1200×675'}</span>`;

function paintItem(block, item, index, total) {
  const field = (name, label, type = 'text', extra = '') => `
    <label class="grow">${label}
      <input type="${type}" data-field="${name}" value="${esc(type === 'datetime-local' ? toInput(item[name]) : item[name] || '')}" ${extra}>
    </label>`;

  return `
    <div class="c-item ${item.active === false ? 'off' : ''}" data-index="${index}">
      <div class="c-thumb">${item.imageUrl
        ? `<img src="${esc(item.imageUrl)}" alt="">`
        : emptyThumb(block.kind)}</div>
      <div>
        <div class="c-row">
          ${field('imageUrl', 'Imagen (URL)')}
          <button class="btn-ghost" data-action="upload" style="align-self:end">Subir…</button>
          ${block.kind === 'tiles' ? `
            <label>Ventana
              <select data-field="window">${WINDOWS.map(([value, label]) =>
                `<option value="${value}" ${item.window === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
            </label>` : ''}
          <label class="chk"><input type="checkbox" data-field="active" ${item.active === false ? '' : 'checked'}> Activo</label>
        </div>
        <div class="c-row">
          ${field('title', block.kind === 'tiles' ? 'Rótulo (vacío = el del idioma)' : 'Título')}
          ${field('subtitle', 'Subtítulo')}
          ${field('alt', 'Texto alternativo')}
        </div>
        <div class="c-row">
          ${field('ctaText', 'Texto del botón')}
          ${field('ctaHref', 'Enlace', 'text', 'placeholder="/es/es/catalog/catalog"')}
          ${field('imageUrlMobile', 'Imagen móvil (opcional)')}
        </div>
        <div class="c-row">
          ${field('publishFrom', 'Publicar desde', 'datetime-local')}
          ${field('publishTo', 'Publicar hasta', 'datetime-local')}
        </div>
      </div>
      <div class="c-actions">
        <button data-action="up" ${index === 0 ? 'disabled' : ''} title="Subir">↑</button>
        <button data-action="down" ${index === total - 1 ? 'disabled' : ''} title="Bajar">↓</button>
        <button class="del" data-action="del">Eliminar</button>
      </div>
    </div>`;
}

function wireBlock(block) {
  const root = document.querySelector(`[data-block="${block.key}"]`);
  const items = blocks[block.key].items;
  const indexOf = el => Number(el.closest('.c-item').dataset.index);

  // Escribir no repinta (se perdería el foco); solo actualiza el modelo
  root.oninput = event => {
    const input = event.target.closest('[data-field]');
    if (!input) return;
    const item = items[indexOf(input)];
    const name = input.dataset.field;
    if (name === 'active') { item.active = input.checked; input.closest('.c-item').classList.toggle('off', !input.checked); }
    else if (name === 'publishFrom' || name === 'publishTo') item[name] = fromInput(input.value);
    else item[name] = input.value;
    if (name === 'imageUrl') {
      const thumb = input.closest('.c-item').querySelector('.c-thumb');
      thumb.innerHTML = item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="">` : emptyThumb(block.kind);
    }
  };

  root.onclick = event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;

    if (action === 'add') {
      items.push({ imageUrl:'', title:'', active:true, window: block.kind === 'tiles' ? nextWindow(items) : undefined });
      return paintContent();
    }
    if (action === 'save') return saveBlock(block);
    if (action === 'clear') {
      if (!items.length || confirm('¿Vaciar el bloque en este idioma? El portal dejará de mostrarlo.')) deleteBlock(block);
      return;
    }

    const index = indexOf(button);
    if (action === 'del') items.splice(index, 1);
    if (action === 'up' && index > 0) items.splice(index - 1, 0, items.splice(index, 1)[0]);
    if (action === 'down' && index < items.length - 1) items.splice(index + 1, 0, items.splice(index, 1)[0]);
    if (action === 'upload') return pickImage(items[index]);
    paintContent();
  };
}

const nextWindow = items => items.some(i => i.window === 'replenishment') ? 'scheduled' : 'replenishment';

function pickImage(item) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp,image/avif,image/gif,image/svg+xml';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/admin/media', { method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form });
      if (res.status === 403) { denied(); throw new Error(SIN_PERMISO); }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || 'HTTP ' + res.status);
      item.imageUrl = data.url;
      flash(`Imagen subida: ${data.name}`);
      await loadMedia();
      paintContent();
    } catch (e) { flash(e.message, 'err'); }
  };
  input.click();
}

async function saveBlock(block) {
  // El orden de la lista manda; el backend valida y normaliza el resto
  const items = blocks[block.key].items.map((item, order) => ({ ...item, order }));
  try {
    const saved = await apiSend('PUT', `/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`, { items });
    blocks[block.key] = { items: saved.items, updatedAt: saved.updatedAt, updatedBy: saved.updatedBy };
    flash(`${block.title}: publicado. Recarga el portal para verlo.`);
    paintContent();
  } catch (e) { flash(`${block.title}: ${e.message}`, 'err'); }
}

async function deleteBlock(block) {
  try {
    await apiSend('DELETE', `/api/admin/content/${block.key}?locale=${encodeURIComponent(locale)}`);
  } catch { /* si no existía, ya está vacío */ }
  blocks[block.key] = { items: [], updatedAt: null, updatedBy: null };
  flash(`${block.title}: bloque vaciado en este idioma.`);
  paintContent();
}

async function deleteMedia(name) {
  if (!confirm(`¿Eliminar ${name}? Los bloques que la usen se quedarán sin imagen.`)) return;
  try {
    await apiSend('DELETE', `/api/admin/media/${encodeURIComponent(name)}`);
    await loadMedia();
    paintContent();
    flash('Imagen eliminada.');
  } catch (e) { flash(e.message, 'err'); }
}

/* ---------- detalle ---------- */
function openDetail(row) {
  $('mTitle').textContent = `${row.doc.entityType} · ${row.doc.externalId}`;
  $('mMeta').textContent = `primera vez ${new Date(row.doc.firstReceivedAt).toLocaleString()} · última ${new Date(row.doc.lastReceivedAt).toLocaleString()}`;
  let pretty = row.doc.payload;
  try { pretty = JSON.stringify(JSON.parse(row.doc.payload), null, 2); } catch {}
  $('mBody').textContent = pretty;
  $('modal').classList.add('on');
}
function closeModal() { $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

/* ---------- init ---------- */
$('doLogin').onclick = login;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logout').onclick = logout;
if (token) enter();
</script>
</body>
