<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" width="1600" height="470" role="img" aria-label="Paisaje volcánico al anochecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a26"/>
      <stop offset=".52" stop-color="#26303f"/>
      <stop offset=".78" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#5c5348"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b98d" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8b98d" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="1" stop-color="#2b3140"/>
    </linearGradient>
    <linearGradient id="ridge-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242935"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151b"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".8">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="470" fill="url(#sky)"/>
  <rect y="250" width="1600" height="120" fill="url(#dusk)"/>

  <!-- tres crestas: la luz se apaga capa a capa -->
  <path d="M0 300 L170 250 L300 288 L470 226 L640 282 L800 238 L980 290 L1160 244 L1330 288 L1490 252 L1600 276 L1600 470 L0 470 Z" fill="url(#ridge-far)"/>
  <path d="M0 344 L200 306 L360 340 L540 300 L720 342 L900 308 L1080 348 L1270 310 L1450 346 L1600 318 L1600 470 L0 470 Z" fill="url(#ridge-mid)"/>
  <path d="M0 392 L240 366 L430 396 L640 368 L860 400 L1080 372 L1300 402 L1500 376 L1600 390 L1600 470 L0 470 Z" fill="url(#ridge-near)"/>

  <rect width="1600" height="470" fill="url(#vignette)"/>
</svg>
