<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Escena de marca en movimiento">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead9"/><stop offset=".5" stop-color="#e7d3b6"/><stop offset="1" stop-color="#d9b98f"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a6350"/><stop offset="1" stop-color="#1c5340"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123f30"/><stop offset="1" stop-color="#0f3227"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1120" cy="360" r="120" fill="#e79a55">
    <animate attributeName="cy" values="380;300;380" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="r" values="118;128;118" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".85;1;.85" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g opacity=".85">
    <path d="M0 560 C 300 500 600 600 900 560 C 1200 520 1400 580 1600 552 V900 H0 Z" fill="url(#h1)" opacity=".35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="24s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M0 640 C 320 590 620 680 980 640 C 1260 610 1440 660 1600 642 V900 H0 Z" fill="url(#h1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -25 0; 0 0" dur="18s" repeatCount="indefinite"/>
  </path>
  <path d="M0 730 C 360 690 660 760 1020 730 C 1300 706 1460 742 1600 730 V900 H0 Z" fill="url(#h2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 20 0; 0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <g fill="#f4efe4">
    <circle cx="300" cy="220" r="4" opacity=".6"><animate attributeName="cy" values="220;180;220" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="160" r="3" opacity=".5"><animate attributeName="cy" values="160;120;160" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="3" opacity=".4"><animate attributeName="cy" values="240;200;240" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="1360" cy="200" r="4" opacity=".5"><animate attributeName="cy" values="200;150;200" dur="10s" repeatCount="indefinite"/></circle>
  </g>
</svg>