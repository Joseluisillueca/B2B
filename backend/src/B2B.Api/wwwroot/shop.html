<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mito Projects™ — B2B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0d0d0d; --ink-2:#1c1c1e; --paper:#f6f6f3; --card:#ffffff; --line:#e7e6e1;
    --muted:#71717a; --blue:#2b2bff; --blue-deep:#1f1fd6;
    --ok:#12813d; --low:#b97d10; --out:#c62b21;
    --r:14px; --shadow:0 1px 2px rgba(13,13,13,.05), 0 10px 30px -18px rgba(13,13,13,.25);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; }
  html { scrollbar-color:#3a3a3f var(--paper); }
  body { margin:0; background:var(--paper); color:var(--ink);
    font:14px/1.5 "Archivo",system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  ::selection { background:var(--blue); color:#fff; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:4px; }
  button { font:inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
  input { font:inherit; color:inherit; }
  .brand { font-family:"Archivo Black",sans-serif; letter-spacing:-.04em; text-transform:lowercase; }
  .brand sup { font-size:.45em; letter-spacing:0; vertical-align:.9em; }

  /* ---------- Login ---------- */
  #login { position:fixed; inset:0; z-index:50; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  #login .panel { width:min(21rem,90vw); }
  #login .brand { color:#fff; font-size:3.2rem; margin:0 0 1.6rem; }
  #login .brand em { color:var(--blue); font-style:normal; }
  #login label { display:block; color:#9a9aa2; font-size:.78rem; margin:0 0 .3rem; }
  #login input { width:100%; background:var(--ink-2); border:1px solid #2e2e33; border-radius:10px;
    padding:.7rem .85rem; color:#fff; margin-bottom:.9rem; caret-color:var(--blue); }
  #login input::placeholder { color:#5c5c64; }
  #login button { width:100%; background:var(--blue); color:#fff; font-weight:700; border-radius:10px;
    padding:.75rem; letter-spacing:.02em; transition:background .15s var(--ease); }
  #login button:hover { background:var(--blue-deep); }
  #login .err { color:#ff8f86; font-size:.82rem; min-height:1.2em; margin:.6rem 0 0; }

  /* ---------- Header ---------- */
  header { position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
    display:flex; align-items:center; gap:1.1rem; padding:.7rem 1.4rem; }
  header .brand { font-size:1.45rem; color:#fff; }
  header .search { flex:1; max-width:26rem; position:relative; }
  header .search svg { position:absolute; left:.7rem; top:50%; translate:0 -50%; opacity:.5; }
  header .search input { width:100%; background:var(--ink-2); border:1px solid #2e2e33; border-radius:999px;
    padding:.5rem 1rem .5rem 2.2rem; color:#fff; }
  header .search input::placeholder { color:#5c5c64; }
  header .spacer { flex:1; }
  .windows { display:flex; background:var(--ink-2); border-radius:999px; padding:.2rem; gap:.2rem; }
  .windows button { border-radius:999px; padding:.35rem .9rem; font-size:.8rem; font-weight:600; color:#9a9aa2;
    transition:all .18s var(--ease); }
  .windows button.on { background:#fff; color:var(--ink); }
  #cartBtn { display:flex; align-items:center; gap:.55rem; background:var(--blue); border-radius:999px;
    padding:.5rem 1.05rem; font-weight:700; color:#fff; transition:background .15s var(--ease); }
  #cartBtn:hover { background:var(--blue-deep); }
  #cartBtn .n { background:#fff; color:var(--blue); border-radius:999px; min-width:1.35rem; height:1.35rem;
    display:grid; place-items:center; font-size:.78rem; transition:transform .2s var(--ease); }
  #cartBtn .n.pulse { transform:scale(1.35); }
  .who { font-size:.78rem; color:#9a9aa2; text-align:right; line-height:1.3; }
  .who b { color:#fff; display:block; }
  #logout { color:#9a9aa2; font-size:.78rem; text-decoration:underline; text-underline-offset:3px; }
  #logout:hover { color:#fff; }

  /* ---------- Layout ---------- */
  #page { display:none; }
  .wrap { display:grid; grid-template-columns:14rem minmax(0,1fr); gap:1.6rem; max-width:97rem;
    margin:0 auto; padding:1.5rem 1.4rem 4rem; }
  .rail { position:sticky; top:4.6rem; align-self:start; }
  .rail h3 { font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:1.4rem 0 .5rem; }
  .rail h3:first-child { margin-top:.2rem; }
  .rail label { display:flex; align-items:center; gap:.55rem; padding:.28rem 0; cursor:pointer; font-size:.88rem; }
  .rail input[type=checkbox] { appearance:none; width:1.05rem; height:1.05rem; border:1.5px solid #c9c8c1;
    border-radius:5px; display:grid; place-items:center; transition:all .12s var(--ease); background:#fff; }
  .rail input[type=checkbox]:checked { background:var(--ink); border-color:var(--ink); }
  .rail input[type=checkbox]:checked::after { content:""; width:.55rem; height:.3rem; border-left:2px solid #fff;
    border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
  .rail .count { color:var(--muted); font-size:.78rem; margin-left:auto; }

  .headline { display:flex; align-items:baseline; gap:.8rem; margin:0 0 1.1rem; }
  .headline h1 { font-family:"Archivo Black",sans-serif; font-size:2rem; letter-spacing:-.03em; margin:0; }
  .headline .muted { color:var(--muted); }

  /* ---------- Producto ---------- */
  .item { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:1.1rem 1.25rem;
    display:grid; grid-template-columns:6.4rem minmax(13rem,18rem) minmax(0,1fr); gap:1.4rem; align-items:center;
    margin-bottom:.9rem; }
  .item .ph { width:6.4rem; height:6.4rem; border-radius:10px; background:
      radial-gradient(120% 120% at 20% 15%, #fdfdfc 0%, #efeeea 55%, #e2e1db 100%); display:grid; place-items:center; overflow:hidden; }
  .item .ph img { width:100%; height:100%; object-fit:cover; }
  .item .ph svg { opacity:.24; }
  .item h2 { font-family:"Archivo Black",sans-serif; font-size:1.02rem; letter-spacing:-.015em; margin:0 0 .3rem;
    text-transform:uppercase; }
  .item .meta { color:var(--muted); font-size:.82rem; display:flex; gap:.9rem; flex-wrap:wrap; }
  .item .meta b { color:var(--ink); font-weight:600; }
  .price { margin-top:.65rem; display:flex; align-items:baseline; gap:.7rem; }
  .price .pvd { font-size:1.5rem; font-weight:700; letter-spacing:-.02em; }
  .price .pvd small { font-size:.72rem; font-weight:600; color:var(--muted); letter-spacing:.06em; margin-right:.3rem; }
  .price .pvp { color:var(--muted); font-size:.85rem; }

  .matrix { display:flex; flex-wrap:wrap; gap:.45rem; justify-content:flex-end; }
  .size { width:3.3rem; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;
    transition:border-color .12s var(--ease), box-shadow .12s var(--ease); }
  .size:focus-within { border-color:var(--blue); box-shadow:0 0 0 3px rgba(43,43,255,.14); }
  .size .lbl { background:var(--ink); color:#fff; font-size:.72rem; font-weight:700; text-align:center; padding:.18rem 0; }
  .size input { width:100%; border:none; text-align:center; padding:.32rem 0 .12rem; font-weight:600; outline:none; }
  .size input::placeholder { color:#cfcec8; }
  .size input:disabled { background:#fafaf8; }
  .size.has { border-color:var(--blue); }
  .size.has .lbl { background:var(--blue); }
  .size.has input { color:var(--blue); font-weight:700; }
  .size .st { display:flex; align-items:center; justify-content:center; gap:.25rem; font-size:.68rem;
    padding:0 0 .3rem; color:var(--muted); }
  .size .st i { width:.42rem; height:.42rem; border-radius:50%; }
  .size.ok .st i { background:var(--ok); } .size.low .st i { background:var(--low); }
  .size.out .st i { background:var(--out); } .size.inf .st i { background:var(--blue); }
  .size.out { opacity:.55; }

  .empty { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:3.2rem;
    text-align:center; color:var(--muted); }
  .empty b { color:var(--ink); display:block; font-size:1.05rem; margin-bottom:.3rem; }
  .empty button { color:var(--blue); text-decoration:underline; text-underline-offset:3px; margin-top:.6rem; }
  .skel { height:9rem; border-radius:var(--r); margin-bottom:.9rem;
    background:linear-gradient(100deg,#eeede9 40%,#f6f6f3 50%,#eeede9 60%); background-size:200% 100%;
    animation:sk 1.1s infinite linear; }
  @keyframes sk { to { background-position:-200% 0; } }

  /* ---------- Carrito ---------- */
  #drawer { position:fixed; inset:0 0 0 auto; width:min(24rem,94vw); z-index:30; background:var(--card);
    box-shadow:-18px 0 50px -30px rgba(13,13,13,.45); translate:100% 0; transition:translate .3s var(--ease);
    display:flex; flex-direction:column; }
  #drawer.on { translate:0 0; }
  #drawer header { background:var(--ink); padding:1rem 1.2rem; display:flex; align-items:center; gap:.7rem; }
  #drawer header h2 { font-family:"Archivo Black",sans-serif; font-size:1rem; margin:0; color:#fff; text-transform:uppercase; }
  #drawer header .muted { color:#9a9aa2; font-size:.78rem; }
  #drawer header button { margin-left:auto; color:#9a9aa2; }
  #drawer header button:hover { color:#fff; }
  #lines { flex:1; overflow-y:auto; padding:1rem 1.2rem; }
  .lin { display:flex; align-items:center; gap:.7rem; padding:.55rem 0; border-bottom:1px solid var(--line); font-size:.86rem; }
  .lin .sz { background:var(--ink); color:#fff; border-radius:6px; font-size:.7rem; font-weight:700;
    padding:.15rem .45rem; }
  .lin .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lin .qp { color:var(--muted); }
  .lin button { color:var(--muted); } .lin button:hover { color:var(--out); }
  #drawer footer { border-top:1px solid var(--line); padding:1rem 1.2rem 1.2rem; }
  #drawer .tot { display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; margin-bottom:.8rem; }
  #drawer .send { width:100%; background:var(--blue); color:#fff; font-weight:700; border-radius:10px; padding:.75rem; }
  #drawer .send:hover { background:var(--blue-deep); }
  #drawer .note { color:var(--muted); font-size:.75rem; margin:.6rem 0 0; text-align:center; }
  #veil { position:fixed; inset:0; z-index:29; background:rgba(13,13,13,.35); opacity:0;
    pointer-events:none; transition:opacity .3s var(--ease); }
  #veil.on { opacity:1; pointer-events:auto; }

  /* ---------- Responsive ---------- */
  @media (max-width:64rem) {
    .wrap { grid-template-columns:1fr; }
    .rail { position:static; display:flex; gap:1.6rem; overflow-x:auto; padding-bottom:.4rem; }
    .rail section { min-width:11rem; }
    .item { grid-template-columns:5rem minmax(0,1fr); }
    .item .matrix { grid-column:1 / -1; justify-content:flex-start; }
    header .search { display:none; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="panel">
    <h1 class="brand">MITO PROJECTS<em>™</em></h1>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu@tienda.com">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="doLogin">Entrar</button>
    <p class="err" id="loginError"></p>
  </div>
</div>

<div id="page">
  <header>
    <span class="brand">MITO PROJECTS<sup>™</sup></span>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar modelo o referencia">
    </div>
    <div class="spacer"></div>
    <div class="windows" id="winSel"></div>
    <button id="cartBtn" aria-label="Abrir carrito">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h14l-1.5 9.5a2 2 0 0 1-2 1.5H9a2 2 0 0 1-2-1.6L5 3H2"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
      <span id="cartWin">—</span><span class="n" id="cartN">0</span>
    </button>
    <div class="who"><b id="who"></b><button id="logout">salir</button></div>
  </header>

  <div class="wrap">
    <aside class="rail" id="rail"></aside>
    <main>
      <div class="headline"><h1>Catálogo</h1><span class="muted" id="nItems"></span></div>
      <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </main>
  </div>
</div>

<div id="veil"></div>
<aside id="drawer" aria-label="Carrito">
  <header><h2 id="dTitle">Carrito</h2><span class="muted" id="dWin"></span>
    <button id="dClose" aria-label="Cerrar carrito"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div id="lines"></div>
  <footer>
    <div class="tot"><span>Total</span><span id="dTot">0,00 €</span></div>
    <button class="send" id="dSend">Enviar pedido</button>
    <p class="note">El envío a Business Central se activa en la siguiente fase — el carrito ya queda guardado.</p>
  </footer>
</aside>

<script>
'use strict';
const $ = id => document.getElementById(id);
const eur = v => v.toLocaleString('es-ES', { minimumFractionDigits: 2 }) + ' €';
let token = sessionStorage.getItem('b2b_shop_token') || '';
let data = { windows: [], items: [] };
let win = null;                       // ventana activa {id,name,orderType}
let filters = { q: '', fam: new Set(), disp: new Set() };
let cart = JSON.parse(localStorage.getItem('b2b_cart') || '{}');   // {winId: {lineKey: line}}

/* ---------- auth ---------- */
async function login() {
  $('loginError').textContent = '';
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('email').value, password: $('password').value, type: 'global', longDuration: true })
  });
  if (!res.ok) { $('loginError').textContent = 'Email o contraseña incorrectos'; return; }
  token = (await res.json()).token;
  sessionStorage.setItem('b2b_shop_token', token);
  sessionStorage.setItem('b2b_shop_who', $('email').value);
  enter();
}
function logout() { sessionStorage.clear(); location.reload(); }

async function enter() {
  $('login').style.display = 'none';
  $('page').style.display = 'block';
  $('who').textContent = sessionStorage.getItem('b2b_shop_who') || '';
  const res = await fetch('/api/shop/catalog', { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { logout(); return; }
  data = await res.json();
  data.windows = [...data.windows];
  win = data.windows.find(w => w.orderType === 'REPLENISHMENT') || data.windows[0] || null;
  renderWindows(); renderRail(); renderList(); syncCartUI();
}

/* ---------- ventanas ---------- */
const winLabel = w => w.orderType === 'REPLENISHMENT' ? 'Reposición' : (w.name || w.id);
function renderWindows() {
  $('winSel').innerHTML = data.windows.map(w =>
    `<button class="${win && w.id === win.id ? 'on' : ''}" data-w="${w.id}">${winLabel(w)}</button>`).join('');
  document.querySelectorAll('#winSel button').forEach(b => b.onclick = () => {
    win = data.windows.find(w => w.id === b.dataset.w);
    renderWindows(); renderList(); syncCartUI();
  });
  $('cartWin').textContent = win ? winLabel(win).toUpperCase() : '—';
}

/* ---------- filtros ---------- */
function famName(f) { return f ? f[0].toUpperCase() + f.slice(1) : 'Sin familia'; }
function renderRail() {
  const fams = [...new Set(data.items.map(i => i.familyId))];
  $('rail').innerHTML = `
    <section><h3>Líneas</h3>${fams.map(f => `
      <label><input type="checkbox" data-f="fam" value="${f}"> ${famName(f)}
        <span class="count">${data.items.filter(i => i.familyId === f).length}</span></label>`).join('')}
    </section>
    <section><h3>Disponibilidad</h3>
      <label><input type="checkbox" data-f="disp" value="ok"> Disponible</label>
      <label><input type="checkbox" data-f="disp" value="low"> Menos de 10 u.</label>
      <label><input type="checkbox" data-f="disp" value="out"> Agotado</label>
    </section>`;
  document.querySelectorAll('.rail input').forEach(c => c.onchange = () => {
    const set = filters[c.dataset.f === 'fam' ? 'fam' : 'disp'];
    c.checked ? set.add(c.value) : set.delete(c.value);
    renderList();
  });
}
$('q') && ($('q').oninput = e => { filters.q = e.target.value.toLowerCase(); renderList(); });

/* ---------- stock ---------- */
function stockOf(p) {
  if (!win) return 0;
  const s = p.stock[win.id] ?? p.stock[win.id?.toLowerCase()] ?? 0;
  return s;
}
const isInfinite = s => s >= 10000;   // sentinela del conector: SCHEDULED abierta
function availClass(s) { return isInfinite(s) ? 'inf' : s <= 0 ? 'out' : s < 10 ? 'low' : 'ok'; }
function modelAvail(item) {
  const states = item.products.map(p => availClass(stockOf(p)));
  if (states.some(s => s === 'ok' || s === 'inf')) return 'ok';
  if (states.some(s => s === 'low')) return 'low';
  return 'out';
}

/* ---------- listado ---------- */
function renderList() {
  const q = filters.q;
  const rows = data.items.filter(i =>
    (!q || i.name.toLowerCase().includes(q) || i.reference.toLowerCase().includes(q)) &&
    (!filters.fam.size || filters.fam.has(i.familyId)) &&
    (!filters.disp.size || filters.disp.has(modelAvail(i))));
  $('nItems').textContent = `· ${rows.length} artículo${rows.length === 1 ? '' : 's'}`;

  if (!rows.length) {
    $('list').innerHTML = `<div class="empty"><b>Ningún artículo coincide</b>
      Prueba a quitar filtros o busca por otra referencia.
      <div><button id="clear">Limpiar filtros</button></div></div>`;
    $('clear').onclick = () => { filters = { q: '', fam: new Set(), disp: new Set() };
      if ($('q')) $('q').value = ''; renderRail(); renderList(); };
    return;
  }

  $('list').innerHTML = rows.map(item => `
    <article class="item" data-m="${item.modelId}">
      <div class="ph">${item.imageUri
        ? `<img src="${item.imageUri}" alt="" loading="lazy">`
        : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-1 4-4 6-6s4-3 7-3c2.5 0 5 1.5 5 4 0 2-1.5 3-4 3H3Z"/><path d="M3 17v2h18v-2"/></svg>`}</div>
      <div>
        <h2>${item.name}</h2>
        <div class="meta"><span>Ref. <b>${item.reference}</b></span><span>${famName(item.familyId)}</span></div>
        <div class="price">
          ${item.pvd != null ? `<span class="pvd"><small>PVD</small>${eur(item.pvd)}</span>` : ''}
          ${item.pvp != null ? `<span class="pvp">PVP ${eur(item.pvp)}</span>` : ''}
        </div>
      </div>
      <div class="matrix">${item.products.map(p => {
        const s = stockOf(p); const cls = availClass(s);
        const line = (cart[win?.id] || {})[item.modelId + '|' + p.size];
        return `<div class="size ${cls}${line ? ' has' : ''}">
          <div class="lbl">${p.size ?? '—'}</div>
          <input type="number" min="0" max="9999" inputmode="numeric" placeholder="0"
            value="${line ? line.qty : ''}" ${cls === 'out' ? 'disabled' : ''}
            data-m="${item.modelId}" data-p="${p.productId}" data-s="${p.size}" aria-label="Talla ${p.size}">
          <div class="st"><i></i>${isInfinite(s) ? '∞' : cls === 'out' ? 'agotado' : s}</div>
        </div>`;
      }).join('')}</div>
    </article>`).join('');

  document.querySelectorAll('.matrix input').forEach(inp => inp.onchange = () => {
    const qty = Math.max(0, parseInt(inp.value || '0', 10));
    const item = data.items.find(i => i.modelId === inp.dataset.m);
    setLine(item, inp.dataset.p, inp.dataset.s, qty);
    inp.value = qty || '';
    inp.closest('.size').classList.toggle('has', qty > 0);
  });
}

/* ---------- carrito ---------- */
function setLine(item, productId, size, qty) {
  if (!win) return;
  cart[win.id] = cart[win.id] || {};
  const key = item.modelId + '|' + size;
  if (qty > 0)
    cart[win.id][key] = { name: item.name, reference: item.reference, productId, size, qty, pvd: item.pvd ?? 0 };
  else
    delete cart[win.id][key];
  localStorage.setItem('b2b_cart', JSON.stringify(cart));
  syncCartUI(true);
}
function cartLines() { return Object.values(cart[win?.id] || {}); }
function syncCartUI(pulse) {
  const lines = cartLines();
  const n = lines.reduce((a, l) => a + l.qty, 0);
  $('cartN').textContent = n;
  if (pulse) { $('cartN').classList.add('pulse'); setTimeout(() => $('cartN').classList.remove('pulse'), 220); }
  $('cartWin').textContent = win ? winLabel(win).toUpperCase() : '—';
  $('dWin').textContent = win ? winLabel(win) : '';
  $('lines').innerHTML = lines.length ? lines.map((l, i) => `
    <div class="lin"><span class="sz">${l.size}</span><span class="nm" title="${l.name}">${l.name}</span>
      <span class="qp">${l.qty} × ${eur(l.pvd)}</span>
      <button data-i="${i}" aria-label="Quitar línea"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>`).join('')
    : '<p class="note" style="color:var(--muted);text-align:center;margin-top:2rem">El carrito está vacío — indica cantidades por talla en el catálogo.</p>';
  document.querySelectorAll('#lines button').forEach(b => b.onclick = () => {
    const l = cartLines()[b.dataset.i];
    delete cart[win.id][Object.keys(cart[win.id])[b.dataset.i]];
    localStorage.setItem('b2b_cart', JSON.stringify(cart));
    syncCartUI(); renderList();
  });
  $('dTot').textContent = eur(lines.reduce((a, l) => a + l.qty * l.pvd, 0));
}
function openDrawer() { $('drawer').classList.add('on'); $('veil').classList.add('on'); }
function closeDrawer() { $('drawer').classList.remove('on'); $('veil').classList.remove('on'); }
$('cartBtn').onclick = openDrawer;
$('dClose').onclick = closeDrawer;
$('veil').onclick = closeDrawer;
$('dSend').onclick = () => alert('El envío del pedido a Business Central se activa en la Fase 4.\nTu carrito queda guardado en este navegador.');

/* ---------- init ---------- */
$('doLogin').onclick = login;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logout').onclick = logout;
if (token) enter();
</script>
